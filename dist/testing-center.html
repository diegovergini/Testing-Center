<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing Center — validação de sistemas de exaustão</title>
  <meta name="description" content="Catálogo de testes físicos, custo, tempo de execução e planejamento automático por disponibilidade de equipamento e de peça.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <style>
/* Testing Center — folha de estilo única.
   O tema segue a preferência do sistema, mas um atributo data-theme no elemento raiz
   tem precedência, para hospedagens que oferecem um alternador próprio. */

:root, :root[data-theme="light"] {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-forte: #cbd5e1;
  --texto: #17222f;
  --texto-fraco: #64748b;
  --marca: #0f5c8c;
  --marca-fraca: #e3f0f8;
  --hot: #c2410c;
  --hot-bg: #fff1e8;
  --cold: #0369a1;
  --cold-bg: #e6f3fb;
  --ambos: #6d28d9;
  --ambos-bg: #f1ebfd;
  --ok: #15803d;
  --ok-bg: #e6f5ec;
  --alerta: #b45309;
  --alerta-bg: #fdf3e3;
  --erro: #b91c1c;
  --erro-bg: #fdecec;
  --sombra: 0 1px 2px rgba(15, 32, 51, .06), 0 4px 12px rgba(15, 32, 51, .05);
  --raio: 10px;
}

/* O :not() evita que a preferência do sistema sobreponha uma escolha explícita de tema claro. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520;
    --surface: #16202e;
    --surface-2: #1b2735;
    --border: #26374b;
    --border-forte: #354a63;
    --texto: #e7eef6;
    --texto-fraco: #94a9bf;
    --marca: #4aa3d8;
    --marca-fraca: #17324a;
    --hot: #fb923c;
    --hot-bg: #3a2113;
    --cold: #56b4e6;
    --cold-bg: #12303f;
    --ambos: #a78bfa;
    --ambos-bg: #2b2148;
    --ok: #4ade80;
    --ok-bg: #12321f;
    --alerta: #fbbf24;
    --alerta-bg: #392b10;
    --erro: #f87171;
    --erro-bg: #3a1717;
    --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .28);
  }
}

:root[data-theme="dark"] {
  --bg: #0e1520;
  --surface: #16202e;
  --surface-2: #1b2735;
  --border: #26374b;
  --border-forte: #354a63;
  --texto: #e7eef6;
  --texto-fraco: #94a9bf;
  --marca: #4aa3d8;
  --marca-fraca: #17324a;
  --hot: #fb923c;
  --hot-bg: #3a2113;
  --cold: #56b4e6;
  --cold-bg: #12303f;
  --ambos: #a78bfa;
  --ambos-bg: #2b2148;
  --ok: #4ade80;
  --ok-bg: #12321f;
  --alerta: #fbbf24;
  --alerta-bg: #392b10;
  --erro: #f87171;
  --erro-bg: #3a1717;
  --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--texto);
  /* Pilha do sistema: nenhuma fonte externa a carregar, nenhum fallback silencioso. */
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Estrutura ---------- */

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

.lateral {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.marca { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.marca .logo {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  background: linear-gradient(140deg, var(--marca), #12b3a8);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
}
.marca h1 { font-size: 15px; margin: 0; line-height: 1.15; }
.marca span { color: var(--texto-fraco); font-size: 11px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; cursor: pointer;
  color: var(--texto-fraco); font-weight: 500; border: none; background: none;
  width: 100%; text-align: left; font-size: 13.5px;
}
.nav-item:hover { background: var(--surface-2); color: var(--texto); }
.nav-item.ativo { background: var(--marca-fraca); color: var(--marca); font-weight: 600; }
.nav-item .contador {
  margin-left: auto; background: var(--border); color: var(--texto-fraco);
  border-radius: 20px; padding: 1px 7px; font-size: 11px; font-weight: 600;
}
.nav-item.ativo .contador { background: var(--marca); color: #fff; }

.nav-titulo {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--texto-fraco); padding: 14px 10px 6px; font-weight: 700;
}

/* min-width:0 impede que o Gantt (largura fixa em px) estique a coluna do grid
   e empurre o restante da página para fora da tela. */
.conteudo { padding: 22px 26px 60px; max-width: 1500px; min-width: 0; }

.cabecalho { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.cabecalho h2 { margin: 0 0 3px; font-size: 20px; }
.cabecalho p { margin: 0; color: var(--texto-fraco); font-size: 13px; max-width: 68ch; }
.cabecalho .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Componentes ---------- */

.cartao {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--raio); box-shadow: var(--sombra);
}
.cartao + .cartao { margin-top: 16px; }
.cartao-topo {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.cartao-topo h3 { margin: 0; font-size: 14px; }
.cartao-corpo { padding: 16px; }

.botao {
  border: 1px solid var(--border-forte); background: var(--surface); color: var(--texto);
  padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
  font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
}
.botao:hover { background: var(--surface-2); }
.botao.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.botao.primario:hover { filter: brightness(1.08); }
.botao.perigo { color: var(--erro); border-color: var(--erro); background: transparent; }
.botao.perigo:hover { background: var(--erro-bg); }
.botao.pequeno { padding: 4px 9px; font-size: 12px; }
.botao:disabled { opacity: .5; cursor: not-allowed; }

input, select, textarea {
  font: inherit; color: var(--texto); background: var(--surface);
  border: 1px solid var(--border-forte); border-radius: 8px; padding: 7px 9px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--marca); outline-offset: -1px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-fraco); margin-bottom: 4px; }
.campo { margin-bottom: 12px; }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 14px; }

.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.filtros .campo { margin: 0; min-width: 150px; }
.filtros .campo.busca { flex: 1; min-width: 220px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--texto-fraco); padding: 9px 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap; background: var(--surface-2);
}
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabela-rolagem { overflow-x: auto; }

.etiqueta {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--texto-fraco); border: 1px solid var(--border);
}
.etiqueta.hot { background: var(--hot-bg); color: var(--hot); border-color: transparent; }
.etiqueta.cold { background: var(--cold-bg); color: var(--cold); border-color: transparent; }
.etiqueta.ambos { background: var(--ambos-bg); color: var(--ambos); border-color: transparent; }
.etiqueta.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.etiqueta.alerta { background: var(--alerta-bg); color: var(--alerta); border-color: transparent; }
.etiqueta.erro { background: var(--erro-bg); color: var(--erro); border-color: transparent; }
.etiqueta.marca { background: var(--marca-fraca); color: var(--marca); border-color: transparent; }

.fases { display: flex; gap: 3px; flex-wrap: nowrap; }
.fase-chip {
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-2); color: var(--texto-fraco); border: 1px solid var(--border);
}
.fase-chip.on { background: var(--marca-fraca); color: var(--marca); border-color: transparent; }

.sub { color: var(--texto-fraco); font-size: 12px; }
.forte { font-weight: 600; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }

.vazio { padding: 44px 20px; text-align: center; color: var(--texto-fraco); }
.vazio strong { display: block; color: var(--texto); margin-bottom: 4px; font-size: 14px; }

/* ---------- Indicadores ---------- */

.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; margin-bottom: 16px; }
.indicador {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--raio);
  padding: 14px 16px; box-shadow: var(--sombra);
}
.indicador .rotulo { font-size: 11.5px; color: var(--texto-fraco); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.indicador .valor { font-size: 23px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; }
.indicador .nota { font-size: 12px; color: var(--texto-fraco); margin-top: 2px; }

/* ---------- Barras ---------- */

.barra-trilho { display: block; height: 7px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; min-width: 90px; }
.barra-valor { display: block; height: 100%; background: var(--marca); }
.barra-valor.alerta { background: var(--alerta); }
.barra-valor.erro { background: var(--erro); }

/* ---------- Gantt ---------- */

.gantt { overflow-x: auto; }
.gantt-grade { min-width: max-content; }
.gantt-linha { display: grid; grid-template-columns: 230px 1fr; align-items: stretch; }
.gantt-linha + .gantt-linha { border-top: 1px solid var(--border); }
.gantt-rotulo {
  padding: 8px 12px; border-right: 1px solid var(--border); position: sticky; left: 0;
  background: var(--surface); z-index: 2; display: flex; flex-direction: column; justify-content: center;
}
.gantt-rotulo .nome { font-weight: 600; font-size: 12.5px; }
.gantt-faixa { position: relative; height: 40px; }
.gantt-linha.cabecalho .gantt-faixa { height: 34px; }
.gantt-linha.cabecalho .gantt-rotulo { background: var(--surface-2); }
.gantt-linha.cabecalho { background: var(--surface-2); position: sticky; top: 0; z-index: 3; }
.gantt-dia { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--border); }
.gantt-dia.fds { background: var(--surface-2); }
.gantt-dia.manutencao { background: repeating-linear-gradient(45deg, var(--alerta-bg), var(--alerta-bg) 5px, transparent 5px, transparent 10px); }
.gantt-dia.hoje { border-right: 2px solid var(--marca); }
.gantt-mes { position: absolute; top: 2px; font-size: 11px; font-weight: 700; color: var(--texto-fraco); padding-left: 5px; white-space: nowrap; }
.gantt-numero { position: absolute; bottom: 3px; font-size: 9.5px; color: var(--texto-fraco); text-align: center; }
.gantt-barra {
  position: absolute; top: 6px; height: 28px; border-radius: 6px; padding: 0 7px;
  display: flex; align-items: center; font-size: 11.5px; font-weight: 600; color: #fff;
  overflow: hidden; white-space: nowrap; cursor: pointer; background: var(--marca);
  border: 1px solid rgba(0, 0, 0, .12);
}
.gantt-barra.hot { background: var(--hot); }
.gantt-barra.cold { background: var(--cold); }
.gantt-barra.ambos { background: var(--ambos); }
.gantt-barra.atrasado { outline: 2px solid var(--erro); outline-offset: 1px; }
.gantt-barra:hover { filter: brightness(1.12); }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--texto-fraco); align-items: center; }
.legenda i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* ---------- Modal ---------- */

.modal-fundo {
  position: fixed; inset: 0; background: rgba(11, 20, 31, .55);
  display: grid; place-items: center; padding: 20px; z-index: 50;
}
.modal {
  background: var(--surface); border-radius: 12px; width: min(640px, 100%);
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  border: 1px solid var(--border);
}
.modal-topo { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
.modal-topo h3 { margin: 0; font-size: 15px; }
.modal-topo .fechar { margin-left: auto; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--texto-fraco); line-height: 1; }
.modal-corpo { padding: 18px; }
.modal-pe { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.aviso {
  padding: 10px 12px; border-radius: 8px; font-size: 12.5px;
  background: var(--marca-fraca); color: var(--marca); margin-bottom: 14px;
}
.aviso.alerta { background: var(--alerta-bg); color: var(--alerta); }
.aviso.erro { background: var(--erro-bg); color: var(--erro); }

.notificacao {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--texto); color: var(--bg); padding: 10px 18px; border-radius: 30px;
  font-size: 13px; font-weight: 500; z-index: 80; box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
}

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .lateral { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .marca { padding-bottom: 0; width: 100%; }
  .nav-titulo { display: none; }
  .nav-item { width: auto; }
  .conteudo { padding: 16px; }
}
  </style>
</head>

    <aside class="lateral" id="lateral">

        <div class="logo">TC</div>
        <div>
          <h1>Testing Center</h1>
          <span>Validação de exaustão</span>
        </div>
      </div>
      <nav id="menu"></nav>
    </aside>
    <main class="conteudo" id="conteudo"></main>

  <script>
/* Utilitários gerais: datas (sempre em UTC, formato ISO YYYY-MM-DD), moeda e DOM. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});

  var MS_DIA = 86400000;
  var NOMES_DIA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var NOMES_MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  /* Converte 'YYYY-MM-DD' em Date UTC à meia-noite. */
  function paraData(iso) {
    var p = String(iso).slice(0, 10).split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }

  function paraISO(data) {
    return data.toISOString().slice(0, 10);
  }

  function somaDias(iso, dias) {
    return paraISO(new Date(paraData(iso).getTime() + dias * MS_DIA));
  }

  function diffDias(isoA, isoB) {
    return Math.round((paraData(isoB) - paraData(isoA)) / MS_DIA);
  }

  function diaDaSemana(iso) {
    return paraData(iso).getUTCDay();
  }

  function hoje() {
    return paraISO(new Date());
  }

  function maiorData(a, b) {
    return diffDias(a, b) > 0 ? b : a;
  }

  /* '2026-07-26' -> '26/jul' ou '26/07/2026' quando completo. */
  function formatarData(iso, completo) {
    if (!iso) return '—';
    var d = paraData(iso);
    if (completo) {
      return String(d.getUTCDate()).padStart(2, '0') + '/' +
        String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
    }
    return String(d.getUTCDate()).padStart(2, '0') + '/' + NOMES_MES[d.getUTCMonth()];
  }

  function formatarMoeda(valor) {
    return 'R$ ' + Number(valor || 0).toLocaleString('pt-BR', {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    });
  }

  /* Horas -> '72 h (3 d)' para leitura rápida no catálogo. */
  function formatarHoras(horas) {
    if (horas < 24) return horas + ' h';
    var dias = horas / 24;
    return horas + ' h (' + (Math.round(dias * 10) / 10) + ' d)';
  }

  function escapar(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function id(prefixo) {
    return prefixo + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  function porId(lista, chave) {
    for (var i = 0; i < lista.length; i++) if (lista[i].id === chave) return lista[i];
    return null;
  }

  TC.util = {
    MS_DIA: MS_DIA,
    NOMES_DIA: NOMES_DIA,
    paraData: paraData,
    paraISO: paraISO,
    somaDias: somaDias,
    diffDias: diffDias,
    diaDaSemana: diaDaSemana,
    hoje: hoje,
    maiorData: maiorData,
    formatarData: formatarData,
    formatarMoeda: formatarMoeda,
    formatarHoras: formatarHoras,
    escapar: escapar,
    id: id,
    porId: porId
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = TC.util;
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
  <script>
/* Dados de partida: clientes, fases de projeto, equipamentos, catálogo de testes e peças.
   Tudo é editável na aplicação — isto é apenas o estado inicial. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});

  /* Fases de projeto. */
  var FASES = [
    { id: 'DV', nome: 'DV — Design Validation', descricao: 'Validação de projeto com protótipos' },
    { id: 'PV', nome: 'PV — Product Validation', descricao: 'Validação com peças de ferramental definitivo' },
    { id: 'VAVE', nome: 'VAVE', descricao: 'Revalidação após mudança de material, processo ou custo' }
  ];

  /* Fases de versões anteriores, convertidas ao carregar dados já salvos. */
  var FASES_ANTIGAS = { CONCEITO: 'DV', PPAP: 'PV', SERIE: 'VAVE' };

  /* Classificação da LTI (ordem de serviço) que abre a demanda.
     Cotação é orçamento: entra no custo, mas não reserva bancada. */
  var TIPOS_LTI = [
    { id: 'COTACAO', nome: 'Cotação', planeja: false, descricao: 'Orçamento; não ocupa bancada nem entra no planejamento' }
  ].concat(FASES.map(function (f) {
    return { id: f.id, nome: f.nome, planeja: true, descricao: f.descricao };
  }));

  var AREAS = [
    { id: 'HOT', nome: 'Hot End', descricao: 'Coletor, downpipe, catalisador, DPF/GPF, flexível' },
    { id: 'COLD', nome: 'Cold End', descricao: 'Silencioso, ressonador, tubos, ponteira, coxins' },
    { id: 'AMBOS', nome: 'Hot & Cold End', descricao: 'Aplicável aos dois lados do sistema' }
  ];

  var PRIORIDADES = [
    { id: 'ALTA', nome: 'Alta', peso: 0 },
    { id: 'MEDIA', nome: 'Média', peso: 1 },
    { id: 'BAIXA', nome: 'Baixa', peso: 2 }
  ];

  var CLIENTES = [
    { id: 'CLI-FOR', nome: 'Forvia Faurecia', segmento: 'Tier 1' },
    { id: 'CLI-TEN', nome: 'Tenneco / Walker', segmento: 'Tier 1' },
    { id: 'CLI-EBE', nome: 'Eberspächer', segmento: 'Tier 1' },
    { id: 'CLI-VW', nome: 'Volkswagen', segmento: 'OEM' },
    { id: 'CLI-STL', nome: 'Stellantis', segmento: 'OEM' },

  <script>

  function celulaJanela(a) {

            '<span class="barra-trilho" style="flex:1"><span class="barra-valor" style="width:' +
              Math.round(g.custo / maximo * 100) + '%"></span></span>' +
            '<span class="forte" style="min-width:92px;text-align:right">' + e(util.formatarMoeda(g.custo)) + '</span>' +
          '</div></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function render(container, ctx) {
    var estado = ctx.estado, hoje = ctx.hoje;
    var todas = ctx.plano.alocacoes.filter(function (a) { return a.demanda.status !== 'CANCELADO'; });

    var custoTotal = 0, horasTotal = 0, atrasadas = 0, semJanela = 0, concluidas = 0, cotacoes = 0;
    todas.forEach(function (a) {
      custoTotal += a.custo.total;
      horasTotal += a.custo.horas;
      if (a.atrasado) atrasadas++;
      if (a.cotacao) cotacoes++;
      else if (!a.inicio && TC.scheduler.STATUS_ATIVOS.indexOf(a.demanda.status) !== -1) semJanela++;
      if (a.demanda.status === 'CONCLUIDO') concluidas++;
    });

    var proximos = ctx.plano.agendadas.filter(function (a) {
      var d = util.diffDias(hoje, a.inicio);
      return d >= 0 && d <= 30;
    }).sort(function (a, b) { return util.diffDias(b.inicio, a.inicio); });

    var emCurso = ctx.plano.agendadas.filter(function (a) {
      return util.diffDias(a.inicio, hoje) >= 0 && util.diffDias(hoje, a.fim) >= 0;
    });

    var alertas = [];
    todas.forEach(function (a) {
      if (a.atrasado) {
        alertas.push({ tipo: 'erro', texto: (a.teste ? a.teste.nome : a.demanda.testeId) + ' em ' +
          (a.peca ? a.peca.nome : '—') + ' termina ' + Math.abs(a.folga) + ' dia(s) após o prazo de ' +
          util.formatarData(a.demanda.prazo, true) + '.' });
      }
      if (!a.cotacao && !a.inicio && TC.scheduler.STATUS_ATIVOS.indexOf(a.demanda.status) !== -1) {
        alertas.push({ tipo: 'erro', texto: (a.teste ? a.teste.nome : a.demanda.testeId) + ': ' + a.motivo });
      }
    });
    estado.pecas.forEach(function (p) {
      var comprometidas = todas.reduce(function (soma, a) {
        return a.peca && a.peca.id === p.id ? soma + a.demanda.quantidade : soma;
      }, 0);
      if (comprometidas > p.quantidade) {
        alertas.push({ tipo: 'alerta', texto: p.nome + ': ' + comprometidas + ' amostras comprometidas para apenas ' +
          p.quantidade + ' disponíveis.' });
      }
    });

    var porCliente = agrupar(todas, function (a) {
      var c = util.porId(estado.clientes, a.demanda.clienteId);
      return c ? c.nome : a.demanda.clienteId;
    });
    /* Cotação fica de fora do agrupamento por fase: ela não representa carga de bancada,
       é orçamento pendente de confirmação. */
    var porFase = agrupar(todas.filter(function (a) { return !a.cotacao; }), function (a) {
      var f = util.porId(TC.data.FASES, a.demanda.tipoLti);
      return f ? f.nome : a.demanda.tipoLti;
    });
    var porArea = agrupar(todas, function (a) {
      var ar = a.teste ? util.porId(TC.data.AREAS, a.teste.area) : null;
      return ar ? ar.nome : '—';
    });

    container.innerHTML =
      '<div class="cabecalho">' +
        '<div><h2>Painel de validação</h2>' +
        '<p>Posição consolidada de tudo que foi confirmado: quanto custa, quanto ocupa de bancada e o que ameaça o prazo.</p></div>' +
      '</div>' +
      '<div class="indicadores">' +
        '<div class="indicador"><div class="rotulo">Custo confirmado</div><div class="valor">' + util.formatarMoeda(custoTotal) + '</div>' +
          '<div class="nota">' + todas.length + ' ensaios · ' + concluidas + ' concluídos</div></div>' +
        '<div class="indicador"><div class="rotulo">Horas de bancada</div><div class="valor">' + Math.round(horasTotal) + ' h</div>' +
          '<div class="nota">setup + ensaio</div></div>' +
        '<div class="indicador"><div class="rotulo">Em execução hoje</div><div class="valor">' + emCurso.length + '</div>' +
          '<div class="nota">' + proximos.length + ' iniciam em 30 dias</div></div>' +
        '<div class="indicador"><div class="rotulo">Riscos de prazo</div>' +
          '<div class="valor" style="color:' + (atrasadas + semJanela ? 'var(--erro)' : 'var(--ok)') + '">' + (atrasadas + semJanela) + '</div>' +
          '<div class="nota">' + atrasadas + ' fora do prazo · ' + semJanela + ' sem janela</div></div>' +
        '<div class="indicador"><div class="rotulo">Cotações</div><div class="valor">' + cotacoes + '</div>' +
          '<div class="nota">orçamento, fora do planejamento</div></div>' +
      '</div>' +
      (alertas.length
        ? '<div class="cartao"><div class="cartao-topo"><h3>Pontos de atenção</h3></div><div class="cartao-corpo">' +
          alertas.slice(0, 12).map(function (al) {
            return '<div class="aviso ' + al.tipo + '" style="margin-bottom:8px">' + e(al.texto) + '</div>';
          }).join('') +
          (alertas.length > 12 ? '<div class="sub">+ ' + (alertas.length - 12) + ' outros.</div>' : '') +
          '</div></div>'
        : '') +
      '<div class="cartao"><div class="cartao-topo"><h3>Custo por cliente</h3></div>' +
        '<div class="tabela-rolagem">' + barras(porCliente, 'Cliente') + '</div></div>' +
      '<div class="cartao"><div class="cartao-topo"><h3>Custo por fase de projeto</h3>' +
        '<span class="sub">cotações não entram, pois ainda não são serviço confirmado</span></div>' +
        '<div class="tabela-rolagem">' + barras(porFase, 'Fase') + '</div></div>' +
      '<div class="cartao"><div class="cartao-topo"><h3>Custo por área do sistema</h3></div>' +
        '<div class="tabela-rolagem">' + barras(porArea, 'Área') + '</div></div>' +
      '<div class="cartao"><div class="cartao-topo"><h3>Próximos 30 dias</h3>' +
        '<span class="sub">ensaios que entram em bancada</span></div>' +
        (proximos.length
          ? '<div class="tabela-rolagem"><table><thead><tr><th>Início</th><th>Procedimento</th><th>Peça</th>' +
            '<th>Equipamento</th><th class="num">Duração</th><th class="num">Custo</th></tr></thead><tbody>' +
            proximos.map(function (a) {
              return '<tr><td class="forte">' + e(util.formatarData(a.inicio, true)) + '</td>' +
                '<td>' + e(a.teste.nome) + '</td>' +
                '<td>' + e(a.peca ? a.peca.nome : '—') + '</td>' +
                '<td><span class="mono">' + e(a.equipamento.id) + '</span></td>' +
                '<td class="num">' + (util.diffDias(a.inicio, a.fim) + 1) + ' d</td>' +
                '<td class="num">' + e(util.formatarMoeda(a.custo.total)) + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : ui.vazio('Nada entra em bancada nos próximos 30 dias', '')) +
      '</div>';
  }

  TC.views = TC.views || {};
  TC.views.painel = { render: render };
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
  <script>
/* Montagem da aplicação: navegação, recálculo do planejamento e backup dos dados. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  var ROTAS = [
    { id: 'catalogo', nome: 'Catálogo de testes', icone: '📋', grupo: 'Validação' },
    { id: 'demandas', nome: 'Demandas', icone: '✅', grupo: 'Validação' },
    { id: 'planejamento', nome: 'Planejamento', icone: '📅', grupo: 'Validação' },
    { id: 'painel', nome: 'Painel', icone: '📊', grupo: 'Validação' },
    { id: 'clientes', nome: 'Clientes', icone: '🏢', grupo: 'Cadastros' },
    { id: 'equipamentos', nome: 'Equipamentos', icone: '⚙️', grupo: 'Cadastros' },
    { id: 'pecas', nome: 'Peças e amostras', icone: '🔩', grupo: 'Cadastros' }
  ];

  /* fase filtra o catálogo por fase de aplicação do procedimento; tipoLti filtra
     demandas e planejamento pela classificação da LTI (inclui Cotação). */
  var filtros = { busca: '', clienteId: '', area: '', fase: '', tipoLti: '', status: '', equipamentoId: '' };
  var rotaAtual = 'catalogo';

  function contadores(estado, plano) {
    return {
      catalogo: estado.testes.length,
      demandas: estado.demandas.filter(function (d) {
        return TC.scheduler.STATUS_ATIVOS.indexOf(d.status) !== -1;
      }).length,
      planejamento: plano.agendadas.length,
      clientes: estado.clientes.length,
      equipamentos: estado.equipamentos.length,
      pecas: estado.pecas.length
    };
  }

  function desenharNavegacao(estado, plano) {
    var lateral = document.getElementById('lateral');
    var contas = contadores(estado, plano);
    var grupoAtual = '';
    var html = '';
    ROTAS.forEach(function (r) {
      if (r.grupo !== grupoAtual) {
        grupoAtual = r.grupo;
        html += '<div class="nav-titulo">' + e(grupoAtual) + '</div>';
      }
      html += '<button class="nav-item' + (r.id === rotaAtual ? ' ativo' : '') + '" data-rota="' + e(r.id) + '">' +
        '<span aria-hidden="true">' + r.icone + '</span>' + e(r.nome) +
        (contas[r.id] !== undefined ? '<span class="contador">' + contas[r.id] + '</span>' : '') +
        '</button>';
    });
    html += '<div class="nav-titulo">Dados</div>' +
      '<button class="nav-item" id="exportar"><span aria-hidden="true">⬇️</span>Exportar backup</button>' +
      '<button class="nav-item" id="importar"><span aria-hidden="true">⬆️</span>Importar backup</button>' +
      '<button class="nav-item" id="restaurar"><span aria-hidden="true">♻️</span>Restaurar padrão</button>' +
      '<div style="margin-top:auto;padding:14px 10px 0" class="sub">Dados gravados neste navegador. Exporte um backup antes de trocar de máquina.</div>';

    lateral.querySelector('#menu').innerHTML = html;

    lateral.querySelectorAll('[data-rota]').forEach(function (botao) {
      botao.onclick = function () { ir(botao.dataset.rota); };
    });
    lateral.querySelector('#exportar').onclick = exportarBackup;
    lateral.querySelector('#importar').onclick = importarBackup;
    lateral.querySelector('#restaurar').onclick = function () {
      ui.confirmarAcao('Isto apaga todas as demandas e volta ao catálogo de exemplo. Continuar?', function () {
        TC.store.restaurarPadrao();
        ui.notificar('Dados restaurados.');
      });
    };
  }

  function exportarBackup() {
    var url = URL.createObjectURL(new Blob([TC.store.exportar()], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'testing-center-' + util.hoje() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    ui.notificar('Backup exportado.');
  }

  function importarBackup() {
    var campo = document.createElement('input');
    campo.type = 'file';
    campo.accept = 'application/json';
    campo.onchange = function () {
      var arquivo = campo.files[0];
      if (!arquivo) return;
      var leitor = new FileReader();
      leitor.onload = function () {
        try {
          TC.store.importar(String(leitor.result));
          ui.notificar('Backup importado.');
        } catch (erro) {
          ui.notificar('Arquivo inválido: ' + erro.message);
        }
      };
      leitor.readAsText(arquivo);
    };
    campo.click();
  }

  function ir(rota) {
    if (!util.porId(ROTAS, rota)) rota = 'catalogo';
    rotaAtual = rota;
    if (global.location.hash !== '#' + rota) global.location.hash = rota;
    global.scrollTo(0, 0);
    desenhar();
  }

  function desenhar() {
    var estado = TC.store.get();
    var hoje = util.hoje();
    var plano = TC.scheduler.planejar(estado, hoje);
    var ctx = {
      estado: estado,
      plano: plano,
      hoje: hoje,
      filtros: filtros,
      ir: ir,
      atualizar: desenhar
    };

    desenharNavegacao(estado, plano);
    TC.views[rotaAtual].render(document.getElementById('conteudo'), ctx);
  }

  function iniciar() {
    TC.store.init();
    TC.store.aoMudar(desenhar);
    var inicial = (global.location.hash || '').replace('#', '');
    rotaAtual = util.porId(ROTAS, inicial) ? inicial : 'catalogo';
    global.addEventListener('hashchange', function () {
      var alvo = (global.location.hash || '').replace('#', '');
      if (alvo && alvo !== rotaAtual) ir(alvo);
    });
    desenhar();
  }

  TC.app = { iniciar: iniciar, ir: ir, ROTAS: ROTAS };

  /* Em página embutida o documento já pode estar pronto quando este script roda. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
</body>
