<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing Center — exhaust system validation</title>
  <meta name="description" content="Physical test catalogue, cost, run time and automatic scheduling by equipment and sample availability.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <style>
/* Testing Center — folha de estilo única.
   O tema segue a preferência do sistema, mas um atributo data-theme no elemento raiz
   tem precedência, para hospedagens que oferecem um alternador próprio. */

:root, :root[data-theme="light"] {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-forte: #cbd5e1;
  --texto: #17222f;
  --texto-fraco: #64748b;
  --marca: #0f5c8c;
  --marca-fraca: #e3f0f8;
  --hot: #c2410c;
  --hot-bg: #fff1e8;
  --cold: #0369a1;
  --cold-bg: #e6f3fb;
  --ambos: #6d28d9;
  --ambos-bg: #f1ebfd;
  --ok: #15803d;
  --ok-bg: #e6f5ec;
  --alerta: #b45309;
  --alerta-bg: #fdf3e3;
  --erro: #b91c1c;
  --erro-bg: #fdecec;
  --sombra: 0 1px 2px rgba(15, 32, 51, .06), 0 4px 12px rgba(15, 32, 51, .05);
  --raio: 10px;
}

/* O :not() evita que a preferência do sistema sobreponha uma escolha explícita de tema claro. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520;
    --surface: #16202e;
    --surface-2: #1b2735;
    --border: #26374b;
    --border-forte: #354a63;
    --texto: #e7eef6;
    --texto-fraco: #94a9bf;
    --marca: #4aa3d8;
    --marca-fraca: #17324a;
    --hot: #fb923c;
    --hot-bg: #3a2113;
    --cold: #56b4e6;
    --cold-bg: #12303f;
    --ambos: #a78bfa;
    --ambos-bg: #2b2148;
    --ok: #4ade80;
    --ok-bg: #12321f;
    --alerta: #fbbf24;
    --alerta-bg: #392b10;
    --erro: #f87171;
    --erro-bg: #3a1717;
    --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .28);
  }
}

:root[data-theme="dark"] {
  --bg: #0e1520;
  --surface: #16202e;
  --surface-2: #1b2735;
  --border: #26374b;
  --border-forte: #354a63;
  --texto: #e7eef6;
  --texto-fraco: #94a9bf;
  --marca: #4aa3d8;
  --marca-fraca: #17324a;
  --hot: #fb923c;
  --hot-bg: #3a2113;
  --cold: #56b4e6;
  --cold-bg: #12303f;
  --ambos: #a78bfa;
  --ambos-bg: #2b2148;
  --ok: #4ade80;
  --ok-bg: #12321f;
  --alerta: #fbbf24;
  --alerta-bg: #392b10;
  --erro: #f87171;
  --erro-bg: #3a1717;
  --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--texto);
  /* Pilha do sistema: nenhuma fonte externa a carregar, nenhum fallback silencioso. */
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Estrutura ---------- */

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

.lateral {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.marca { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.marca .logo {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  background: linear-gradient(140deg, var(--marca), #12b3a8);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
}
.marca h1 { font-size: 15px; margin: 0; line-height: 1.15; }
.marca span { color: var(--texto-fraco); font-size: 11px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; cursor: pointer;
  color: var(--texto-fraco); font-weight: 500; border: none; background: none;
  width: 100%; text-align: left; font-size: 13.5px;
}
.nav-item:hover { background: var(--surface-2); color: var(--texto); }
.nav-item.ativo { background: var(--marca-fraca); color: var(--marca); font-weight: 600; }
.nav-item .contador {
  margin-left: auto; background: var(--border); color: var(--texto-fraco);
  border-radius: 20px; padding: 1px 7px; font-size: 11px; font-weight: 600;
}
.nav-item.ativo .contador { background: var(--marca); color: #fff; }

.nav-titulo {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--texto-fraco); padding: 14px 10px 6px; font-weight: 700;
}

/* min-width:0 impede que o Gantt (largura fixa em px) estique a coluna do grid
   e empurre o restante da página para fora da tela. */
.conteudo { padding: 22px 26px 60px; max-width: 1500px; min-width: 0; }

.cabecalho { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.cabecalho h2 { margin: 0 0 3px; font-size: 20px; }
.cabecalho p { margin: 0; color: var(--texto-fraco); font-size: 13px; max-width: 68ch; }
.cabecalho .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Componentes ---------- */

.cartao {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--raio); box-shadow: var(--sombra);
}
.cartao + .cartao { margin-top: 16px; }
.cartao-topo {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.cartao-topo h3 { margin: 0; font-size: 14px; }
.cartao-corpo { padding: 16px; }

.botao {
  border: 1px solid var(--border-forte); background: var(--surface); color: var(--texto);
  padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
  font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
}
.botao:hover { background: var(--surface-2); }
.botao.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.botao.primario:hover { filter: brightness(1.08); }
.botao.perigo { color: var(--erro); border-color: var(--erro); background: transparent; }
.botao.perigo:hover { background: var(--erro-bg); }
.botao.pequeno { padding: 4px 9px; font-size: 12px; }
.botao:disabled { opacity: .5; cursor: not-allowed; }

input, select, textarea {
  font: inherit; color: var(--texto); background: var(--surface);
  border: 1px solid var(--border-forte); border-radius: 8px; padding: 7px 9px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--marca); outline-offset: -1px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-fraco); margin-bottom: 4px; }
.campo { margin-bottom: 12px; }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 14px; }

.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.filtros .campo { margin: 0; min-width: 150px; }
.filtros .campo.busca { flex: 1; min-width: 220px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--texto-fraco); padding: 9px 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap; background: var(--surface-2);
}
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabela-rolagem { overflow-x: auto; }

.etiqueta {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--texto-fraco); border: 1px solid var(--border);
}
.etiqueta.hot { background: var(--hot-bg); color: var(--hot); border-color: transparent; }
.etiqueta.cold { background: var(--cold-bg); color: var(--cold); border-color: transparent; }
.etiqueta.ambos { background: var(--ambos-bg); color: var(--ambos); border-color: transparent; }
.etiqueta.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.etiqueta.alerta { background: var(--alerta-bg); color: var(--alerta); border-color: transparent; }
.etiqueta.erro { background: var(--erro-bg); color: var(--erro); border-color: transparent; }
.etiqueta.marca { background: var(--marca-fraca); color: var(--marca); border-color: transparent; }

.fases { display: flex; gap: 3px; flex-wrap: nowrap; }
.fase-chip {
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-2); color: var(--texto-fraco); border: 1px solid var(--border);
}
.fase-chip.on { background: var(--marca-fraca); color: var(--marca); border-color: transparent; }

.sub { color: var(--texto-fraco); font-size: 12px; }
.forte { font-weight: 600; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }

.vazio { padding: 44px 20px; text-align: center; color: var(--texto-fraco); }
.vazio strong { display: block; color: var(--texto); margin-bottom: 4px; font-size: 14px; }

/* ---------- Indicadores ---------- */

.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; margin-bottom: 16px; }
.indicador {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--raio);
  padding: 14px 16px; box-shadow: var(--sombra);
}
.indicador .rotulo { font-size: 11.5px; color: var(--texto-fraco); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.indicador .valor { font-size: 23px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; }
.indicador .nota { font-size: 12px; color: var(--texto-fraco); margin-top: 2px; }

/* ---------- Barras ---------- */

.barra-trilho { display: block; height: 7px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; min-width: 90px; }
.barra-valor { display: block; height: 100%; background: var(--marca); }
.barra-valor.alerta { background: var(--alerta); }
.barra-valor.erro { background: var(--erro); }

/* ---------- Gantt ---------- */

.gantt { overflow-x: auto; }
.gantt-grade { min-width: max-content; }
.gantt-linha { display: grid; grid-template-columns: 230px 1fr; align-items: stretch; }
.gantt-linha + .gantt-linha { border-top: 1px solid var(--border); }
.gantt-rotulo {
  padding: 8px 12px; border-right: 1px solid var(--border); position: sticky; left: 0;
  background: var(--surface); z-index: 2; display: flex; flex-direction: column; justify-content: center;
}
.gantt-rotulo .nome { font-weight: 600; font-size: 12.5px; }
.gantt-faixa { position: relative; height: 40px; }
.gantt-linha.cabecalho .gantt-faixa { height: 34px; }
.gantt-linha.cabecalho .gantt-rotulo { background: var(--surface-2); }
.gantt-linha.cabecalho { background: var(--surface-2); position: sticky; top: 0; z-index: 3; }
.gantt-dia { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--border); }
.gantt-dia.fds { background: var(--surface-2); }
.gantt-dia.manutencao { background: repeating-linear-gradient(45deg, var(--alerta-bg), var(--alerta-bg) 5px, transparent 5px, transparent 10px); }
.gantt-dia.hoje { border-right: 2px solid var(--marca); }
.gantt-mes { position: absolute; top: 2px; font-size: 11px; font-weight: 700; color: var(--texto-fraco); padding-left: 5px; white-space: nowrap; }
.gantt-numero { position: absolute; bottom: 3px; font-size: 9.5px; color: var(--texto-fraco); text-align: center; }
.gantt-barra {
  position: absolute; top: 6px; height: 28px; border-radius: 6px; padding: 0 7px;
  display: flex; align-items: center; font-size: 11.5px; font-weight: 600; color: #fff;
  overflow: hidden; white-space: nowrap; cursor: pointer; background: var(--marca);
  border: 1px solid rgba(0, 0, 0, .12);
}
.gantt-barra.hot { background: var(--hot); }
.gantt-barra.cold { background: var(--cold); }
.gantt-barra.ambos { background: var(--ambos); }
.gantt-barra.atrasado { outline: 2px solid var(--erro); outline-offset: 1px; }
.gantt-barra:hover { filter: brightness(1.12); }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--texto-fraco); align-items: center; }
.legenda i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* ---------- Modal ---------- */

.modal-fundo {
  position: fixed; inset: 0; background: rgba(11, 20, 31, .55);
  display: grid; place-items: center; padding: 20px; z-index: 50;
}
.modal {
  background: var(--surface); border-radius: 12px; width: min(640px, 100%);
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  border: 1px solid var(--border);
}
.modal-topo { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
.modal-topo h3 { margin: 0; font-size: 15px; }
.modal-topo .fechar { margin-left: auto; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--texto-fraco); line-height: 1; }
.modal-corpo { padding: 18px; }
.modal-pe { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.aviso {
  padding: 10px 12px; border-radius: 8px; font-size: 12.5px;
  background: var(--marca-fraca); color: var(--marca); margin-bottom: 14px;
}
.aviso.alerta { background: var(--alerta-bg); color: var(--alerta); }
.aviso.erro { background: var(--erro-bg); color: var(--erro); }

.notificacao {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--texto); color: var(--bg); padding: 10px 18px; border-radius: 30px;
  font-size: 13px; font-weight: 500; z-index: 80; box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
}

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .lateral { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .marca { padding-bottom: 0; width: 100%; }
  .nav-titulo { display: none; }
  .nav-item { width: auto; }
  .conteudo { padding: 16px; }
}

/* ---------- Lista de seleção (testes a cotar) ---------- */

.lista-selecao {
  border: 1px solid var(--border-forte);
  border-radius: 8px;
  max-height: 260px;
  overflow-y: auto;
  background: var(--surface);
}
.linha-selecao {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
}
.linha-selecao:last-child { border-bottom: none; }
.linha-selecao:hover { background: var(--surface-2); }
.linha-selecao.marcada { background: var(--marca-fraca); }
.linha-selecao input[type="number"] { padding: 4px 6px; }

/* ---------- Seletor de perfil ---------- */

.perfil {
  border-top: 1px solid var(--border);
  margin-top: 10px;
  padding: 12px 10px 4px;
}
.perfil label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--texto-fraco); font-weight: 700; margin-bottom: 6px;
}
.perfil select { font-size: 12.5px; padding: 6px 8px; }
.perfil .descricao { font-size: 11.5px; color: var(--texto-fraco); margin-top: 6px; line-height: 1.4; }

.somente-leitura {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--texto-fraco);
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 11px;
}

tfoot td { border-top: 2px solid var(--border-forte); background: var(--surface-2); }
  </style>
</head>

    <aside class="lateral" id="lateral">
      <div class="marca">
        <div class="logo">TC</div>
        <div>
          <h1>Testing Center</h1>
          <span>Exhaust validation</span>
        </div>
      </div>
      <nav id="menu"></nav>
    </aside>
    <main class="conteudo" id="conteudo"></main>

  <script>
/* General helpers: dates (always UTC, ISO YYYY-MM-DD), currency and DOM.

   Dates are shown as "26 Jul 2026", never 26/07 or 07/26: the platform runs in English for
   a Brazilian team, and a numeric month is read one way by each of them. The month name
   removes the ambiguity at the cost of two characters. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});

  var MS_DIA = 86400000;
  var NOMES_DIA = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var NOMES_MES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* Turns 'YYYY-MM-DD' into a UTC Date at midnight. */
  function paraData(iso) {
    var p = String(iso).slice(0, 10).split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }

  function paraISO(data) {
    return data.toISOString().slice(0, 10);
  }

  function somaDias(iso, dias) {
    return paraISO(new Date(paraData(iso).getTime() + dias * MS_DIA));
  }

  function diffDias(isoA, isoB) {
    return Math.round((paraData(isoB) - paraData(isoA)) / MS_DIA);
  }

  function diaDaSemana(iso) {
    return paraData(iso).getUTCDay();
  }

  function hoje() {
    return paraISO(new Date());
  }

  function maiorData(a, b) {
    return diffDias(a, b) > 0 ? b : a;
  }

  /* '2026-07-26' -> '26 Jul', or '26 Jul 2026' when complete. */
  function formatarData(iso, completo) {
    if (!iso) return '—';
    var d = paraData(iso);
    var curto = String(d.getUTCDate()).padStart(2, '0') + ' ' + NOMES_MES[d.getUTCMonth()];
    return completo ? curto + ' ' + d.getUTCFullYear() : curto;
  }

  /* Catalogue values and totals are read in thousands: cents only add noise. The exception
     is the hourly rate, negotiated down to cents — hence the parameter.

     The currency stays BRL, which is what the test centre charges in, but the grouping is
     the English one: "R$ 3,800" in a page that reads "R$ 3.800" would be taken for three
     point eight by half the people opening it. */
  function formatarMoeda(valor, casas) {
    var decimais = casas || 0;
    return 'R$ ' + Number(valor || 0).toLocaleString('en-US', {
      minimumFractionDigits: decimais,
      maximumFractionDigits: decimais
    });
  }

  /* Hourly rate: always with cents. */
  function formatarTaxa(valor) {
    return formatarMoeda(valor, 2);
  }

  /* Hours -> '72 h (3 d)', for quick reading in the catalogue. */
  function formatarHoras(horas) {
    if (horas < 24) return horas + ' h';
    var dias = horas / 24;
    return horas + ' h (' + (Math.round(dias * 10) / 10) + ' d)';
  }

  /* Trims a long text to fit a table cell without breaking the reading. */
  function recortar(texto, limite) {
    var t = String(texto == null ? '' : texto);
    return t.length > limite ? t.slice(0, limite - 1).trimEnd() + '…' : t;
  }

  function escapar(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function id(prefixo) {
    return prefixo + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  function porId(lista, chave) {
    for (var i = 0; i < lista.length; i++) if (lista[i].id === chave) return lista[i];
    return null;
  }

  TC.util = {
    MS_DIA: MS_DIA,
    NOMES_DIA: NOMES_DIA,
    paraData: paraData,
    paraISO: paraISO,
    somaDias: somaDias,
    diffDias: diffDias,
    diaDaSemana: diaDaSemana,
    hoje: hoje,
    maiorData: maiorData,
    formatarData: formatarData,
    formatarMoeda: formatarMoeda,
    formatarTaxa: formatarTaxa,
    formatarHoras: formatarHoras,
    escapar: escapar,
    recortar: recortar,
    id: id,
    porId: porId
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = TC.util;
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
  <script>
/* Inventory of instruments and sensors subject to calibration.

       registro do que foi feito. Parada antiga que já terminou entra como realizada — ela
       aconteceu —, e a que ainda está por vir fica planejada. */
    (estado.equipamentos || []).forEach(function (eq) {
      (eq.manutencao || []).forEach(function (m) {
        if (typeof m.tipo !== 'string') m.tipo = 'PREVENTIVA';
        if (typeof m.oQueFoiFeito !== 'string') m.oQueFoiFeito = '';
        if (typeof m.responsavel !== 'string') m.responsavel = '';
        if (typeof m.situacao !== 'string') {
          m.situacao = util.diffDias(util.hoje(), m.fim) < 0
            ? TC.manutencao.REALIZADA : TC.manutencao.PLANEJADA;
        }
      });
    });

    /* Status antigo (PENDENTE/EM_ANDAMENTO/CONCLUIDO/CANCELADO) mais o campo separado de
       situação do relatório viraram um fluxo só. A conversão junta os dois: quem estava
       concluído com relatório aprovado passa direto a validado. */
    var STATUS_ANTIGO = {
      PENDENTE: 'SOLICITADA', EM_ANDAMENTO: 'EM_EXECUCAO',
      CONCLUIDO: 'CONCLUIDA', CANCELADO: 'CANCELADA'
    };
    var RELATORIO_ANTIGO = {
      EM_ANALISE: 'RELATORIO_ENVIADO', CORRECAO: 'EM_CORRECAO', APROVADO: 'VALIDADA'
    };
    var estadosDemanda = TC.fluxo.estados('demanda').map(function (e) { return e.id; });
    (estado.demandas || []).forEach(function (d) {
      if (estadosDemanda.indexOf(d.status) === -1) {
        d.status = STATUS_ANTIGO[d.status] || 'SOLICITADA';
        /* Só quem já terminou o ensaio pode ter avançado no ciclo do relatório. */
        if (d.status === 'CONCLUIDA' && RELATORIO_ANTIGO[d.relatorioStatus]) {
          d.status = RELATORIO_ANTIGO[d.relatorioStatus];
        }
      }
      delete d.relatorioStatus;
      if (!Array.isArray(d.historico)) d.historico = [];
    });

    /* Antes da LTI, a demanda guardava só a fase; ela vira a classificação da ordem
       de serviço, e o número fica em branco para ser preenchido. */
    (estado.demandas || []).forEach(function (d) {
      var tipos = TC.data.TIPOS_LTI.map(function (t) { return t.id; });
      if (!d.tipoLti || tipos.indexOf(d.tipoLti) === -1) {
        d.tipoLti = converter(d.fase) || validas[0];
      }
      if (typeof d.lti !== 'string') d.lti = '';
      if (typeof d.projeto !== 'string') d.projeto = '';
      if (typeof d.partNumber !== 'string') d.partNumber = '';
      /* Execução real e ciclo do relatório: alimentam os indicadores do painel
         (testes realizados no mês e certo da primeira vez). */
      if (typeof d.dataConclusao !== 'string') d.dataConclusao = '';
      if (typeof d.dataRelatorio !== 'string') d.dataRelatorio = '';
      if (typeof d.relatorioCorrecoes !== 'number') d.relatorioCorrecoes = 0;
      if (!d.dataAmostras) d.dataAmostras = dataAntigaDaPeca[d.pecaId] || util.hoje();
      delete d.fase;
    });

    /* Perfis, permissões e cotações chegaram depois; estados antigos ganham o padrão. */
    if (!Array.isArray(estado.cotacoes)) estado.cotacoes = [];
    var COTACAO_ANTIGA = {
      ABERTA: 'RASCUNHO', ENVIADA: 'SOLICITADA', APROVADA: 'APROVADA', RECUSADA: 'RECUSADA'
    };
    var estadosCotacao = TC.fluxo.estados('cotacao').map(function (e) { return e.id; });
    estado.cotacoes.forEach(function (c) {
      if (estadosCotacao.indexOf(c.status) === -1) {
        c.status = COTACAO_ANTIGA[c.status] || 'RASCUNHO';
      }
      if (!Array.isArray(c.historico)) c.historico = [];
      if (typeof c.lti !== 'string') c.lti = '';
      if (typeof c.previsaoExecucao !== 'string') c.previsaoExecucao = '';
      /* A peça de referência saiu; o item passou a guardar a quantidade em "amostras".
         Os totais gravados não são recalculados: cotação arquivada tem preço congelado. */
      delete c.pecaId;
      (c.itens || []).forEach(function (i) {
        if (typeof i.amostras !== 'number' || i.quantidade !== undefined) {
          i.amostras = i.quantidade || i.amostras || 1;
        }
        delete i.quantidade;
      });
    });
    var padrao = TC.data.PERMISSOES_PADRAO;
    var permissoes = estado.permissoes || {};
    Object.keys(padrao).forEach(function (rota) {
      var atual = permissoes[rota];
      permissoes[rota] = {
        ver: Array.isArray(atual && atual.ver) ? atual.ver : padrao[rota].ver.slice(),
        editar: Array.isArray(atual && atual.editar) ? atual.editar : padrao[rota].editar.slice()
      };
    });
    estado.permissoes = permissoes;

    var perfisValidos = TC.data.PERFIS.map(function (p) { return p.id; });
    if (perfisValidos.indexOf(estado.perfilAtual) === -1) estado.perfilAtual = 'TESTES';

    return estado;
  }

  /* Cópia publicada para a equipe: o build embute um instantâneo dos dados em
     TC.PUBLICACAO e a aplicação passa a ler dele, sem gravar nada. Todo mundo que abrir
     o arquivo vê exatamente os mesmos dados — é o compartilhamento possível enquanto não
     existe servidor. Ver publicada() em permissoes.js: nesta cópia ninguém edita. */
  function publicacao() {
    return TC.PUBLICACAO && TC.PUBLICACAO.dados ? TC.PUBLICACAO : null;
  }

  function carregar() {
    var pub = publicacao();
    if (pub) return migrar(JSON.parse(JSON.stringify(pub.dados)));
    try {
      var bruto = global.localStorage && global.localStorage.getItem(CHAVE);
      if (bruto) {
        var lido = JSON.parse(bruto);
        if (lido && lido.testes && lido.equipamentos) return migrar(lido);
      }
    } catch (e) {
      console.warn('Could not read the saved data, starting again from the seed catalogue.', e);
    }
    return TC.data.seed();
  }

  function salvar() {
    /* Na cópia publicada não há onde gravar: o dado de origem está na máquina de quem
       mantém o centro de testes, e gravar aqui só criaria uma divergência silenciosa. */
    if (publicacao()) return;
    try {
      if (global.localStorage) global.localStorage.setItem(CHAVE, JSON.stringify(estado));
    } catch (e) {
      console.warn('Could not save to the browser.', e);
    }
  }

  /* Aplica uma passagem de estado, gravando o histórico. Os campos que a transição exige
     (data de conclusão, data de validação) são gravados junto, na mesma operação — não
     adianta mudar o estado e deixar a data para depois. */
  function mover(tipo, registro, para, dados) {
    var valores = dados || {};
    var perfil = TC.permissoes.perfilAtual(estado);
    var conferido = TC.fluxo.validar(tipo, registro, para, perfil, valores);
    if (!conferido.ok) return conferido;

    var de = registro.status;
    ['dataConclusao', 'dataRelatorio'].forEach(function (campo) {
      if (valores[campo]) registro[campo] = valores[campo];
    });
    if (conferido.transicao.contaCorrecao) {
      registro.relatorioCorrecoes = (Number(registro.relatorioCorrecoes) || 0) + 1;
    }
    registro.status = para;
    registro.historico = registro.historico || [];
    registro.historico.push(
      TC.fluxo.registroDeHistorico(de, para, perfil, valores.nota));
    commit();
    return { ok: true, registro: registro };
  }

  function notificar() {
    ouvintes.forEach(function (fn) { fn(estado); });
  }

  function commit() {
    salvar();
    notificar();
  }

  var store = {
    init: function () {
      estado = carregar();
      return estado;
    },
    get: function () { return estado; },
    aoMudar: function (fn) { ouvintes.push(fn); },

    /* ---- Demandas ---- */
    criarDemanda: function (dados) {
      var demanda = {
        id: util.id('DM'),
        testeId: dados.testeId,
        pecaId: dados.pecaId,
        clienteId: dados.clienteId,
        projeto: (dados.projeto || '').trim(),
        partNumber: (dados.partNumber || '').trim(),
        lti: (dados.lti || '').trim(),
        tipoLti: dados.tipoLti || 'DV',
        prioridade: dados.prioridade || 'MEDIA',
        quantidade: Number(dados.quantidade) || 1,
        dataAmostras: dados.dataAmostras || util.hoje(),
        /* Preenchidos depois, conforme o ensaio roda e o relatório vai ao cliente. */
        dataConclusao: '',
        dataRelatorio: '',
        relatorioCorrecoes: 0,
        historico: [],
        documentos: [],
        prazo: dados.prazo || '',
        inicioFixo: dados.inicioFixo || '',
        observacao: dados.observacao || '',
        status: TC.fluxo.FLUXOS.demanda.inicial,
        criadoEm: util.hoje()
      };
      estado.demandas.push(demanda);
      commit();
      return demanda;
    },
    atualizarDemanda: function (id, campos) {
      var d = util.porId(estado.demandas, id);
      if (!d) return null;
      Object.keys(campos).forEach(function (k) { d[k] = campos[k]; });
      commit();
      return d;
    },
    removerDemanda: function (id) {
      estado.demandas = estado.demandas.filter(function (d) { return d.id !== id; });
      commit();
    },

    /* ---- Catálogo de testes ---- */
    salvarTeste: function (teste) {
      var existente = teste.id ? util.porId(estado.testes, teste.id) : null;
      if (existente) {
        Object.keys(teste).forEach(function (k) { existente[k] = teste[k]; });
      } else {
        teste.id = teste.id || util.id('TP');
        estado.testes.push(teste);
      }
      commit();
      return teste;
    },
    removerTeste: function (id) {
      estado.testes = estado.testes.filter(function (t) { return t.id !== id; });
      estado.demandas = estado.demandas.filter(function (d) { return d.testeId !== id; });
      commit();
    },

    /* ---- Equipamentos ---- */
    salvarEquipamento: function (equipamento) {
      var existente = equipamento.id ? util.porId(estado.equipamentos, equipamento.id) : null;
      if (existente) {
        Object.keys(equipamento).forEach(function (k) { existente[k] = equipamento[k]; });
      } else {
        equipamento.manutencao = equipamento.manutencao || [];
        estado.equipamentos.push(equipamento);
      }
      commit();
      return equipamento;
    },
    removerEquipamento: function (id) {
      estado.equipamentos = estado.equipamentos.filter(function (e) { return e.id !== id; });
      commit();
    },
    /* A parada nasce planejada — e já bloqueia a agenda do equipamento a partir daí. */
    adicionarManutencao: function (equipamentoId, janela) {
      var eq = util.porId(estado.equipamentos, equipamentoId);
      if (!eq) return null;
      eq.manutencao = eq.manutencao || [];
      var parada = {
        id: util.id('MN'),
        inicio: janela.inicio, fim: janela.fim,
        tipo: janela.tipo || 'PREVENTIVA',
        motivo: janela.motivo || 'Maintenance',
        situacao: janela.situacao || TC.manutencao.PLANEJADA,
        oQueFoiFeito: janela.oQueFoiFeito || '',
        responsavel: janela.responsavel || ''
      };
      eq.manutencao.push(parada);
      commit();
      return parada;
    },

    /* Registro do que foi feito: a parada passa a realizada e guarda a execução.
       As datas podem mudar aqui — manutenção raramente termina no dia previsto. */
    registrarManutencao: function (equipamentoId, paradaId, dados) {
      var eq = util.porId(estado.equipamentos, equipamentoId);
      if (!eq) return null;
      var parada = util.porId(eq.manutencao || [], paradaId);
      if (!parada) return null;
      if (dados.inicio) parada.inicio = dados.inicio;
      if (dados.fim) parada.fim = dados.fim;
      if (dados.tipo) parada.tipo = dados.tipo;
      if (typeof dados.motivo === 'string' && dados.motivo.trim()) parada.motivo = dados.motivo.trim();
      parada.oQueFoiFeito = (dados.oQueFoiFeito || '').trim();
      parada.responsavel = (dados.responsavel || '').trim();
      parada.situacao = TC.manutencao.REALIZADA;
      commit();
      return parada;
    },
    removerManutencao: function (equipamentoId, janelaId) {
      var eq = util.porId(estado.equipamentos, equipamentoId);
      if (!eq) return;
      eq.manutencao = (eq.manutencao || []).filter(function (m) { return m.id !== janelaId; });
      commit();
    },

    /* ---- Instrumentos e calibração ---- */
    salvarInstrumento: function (instrumento) {
      var existente = instrumento.id ? util.porId(estado.instrumentos, instrumento.id) : null;
      if (existente) {
        Object.keys(instrumento).forEach(function (k) { existente[k] = instrumento[k]; });
        commit();
        return existente;
      }
      instrumento.id = instrumento.id || util.id('INS');
      instrumento.historico = instrumento.historico || [];
      estado.instrumentos.push(instrumento);
      commit();
      return instrumento;
    },
    removerInstrumento: function (id) {
      estado.instrumentos = estado.instrumentos.filter(function (i) { return i.id !== id; });
      commit();
    },

    /* Registro de uma calibração: entra no histórico e passa a ser a vigente. O vencimento
       vem do certificado quando informado; senão sai da periodicidade do instrumento.
       Reprovado não renova a validade — o instrumento não pode voltar a medir por decurso
       de prazo, então ele sai de uso até alguém decidir o que fazer. */
    registrarCalibracao: function (instrumentoId, dados) {
      var i = util.porId(estado.instrumentos, instrumentoId);
      if (!i) return { ok: false, motivo: 'Instrument not found.' };
      if (!dados.data) return { ok: false, motivo: 'Enter the calibration date.' };

      var resultado = dados.resultado || 'APROVADO';
      var registro = {
        id: util.id('CAL'),
        data: dados.data,
        resultado: resultado,
        certificado: (dados.certificado || '').trim(),
        laboratorio: (dados.laboratorio || '').trim(),
        proximaCalibracao: dados.proximaCalibracao || '',
        observacao: (dados.observacao || '').trim(),
        registradoEm: util.hoje()
      };
      i.historico = i.historico || [];
      i.historico.push(registro);

      /* O link do certificado, quando informado, vira documento do instrumento amarrado a
         este registro — assim o histórico aponta para o PDF que o comprova. Link recusado
         não derruba o registro da calibração: a calibração aconteceu de todo jeito. */
      if ((dados.certificadoLink || '').trim()) {
        var anexo = TC.documentos.criar({
          tipo: 'CERTIFICADO', link: dados.certificadoLink, refId: registro.id,
          nome: dados.certificadoNome || (registro.certificado
            ? 'Certificate ' + registro.certificado : ''),
          observacao: registro.laboratorio
        }, TC.permissoes.perfilAtual(estado));
        if (anexo.ok) {
          i.documentos = i.documentos || [];
          i.documentos.push(anexo.documento);
          registro.documentoId = anexo.documento.id;
        } else {
          registro.observacao = (registro.observacao ? registro.observacao + ' ' : '') +
            '(certificate link not saved: ' + anexo.motivo + ')';
        }
      }

      i.ultimaCalibracao = registro.data;
      i.ultimoResultado = resultado;
      i.certificado = registro.certificado;
      i.laboratorio = registro.laboratorio;
      if (typeof dados.periodicidadeMeses === 'number' && dados.periodicidadeMeses > 0) {
        i.periodicidadeMeses = dados.periodicidadeMeses;
      }
      if (resultado === 'REPROVADO') {
        i.proximaCalibracao = '';
        i.situacao = 'FORA_DE_USO';
      } else {
        i.proximaCalibracao = registro.proximaCalibracao ||
          TC.calibracao.somaMeses(registro.data, i.periodicidadeMeses);
        i.situacao = 'EM_USO';
      }
      commit();
      return { ok: true, instrumento: i, registro: registro };
    },

    /* Lançamento em lote das datas que já estavam em planilha. Grava tudo de uma vez —
       229 commits seguidos redesenhariam a tela 229 vezes — e reaproveita a mesma regra
       de validade do registro individual, para não haver dois jeitos de calcular a mesma
       coisa. Linhas com problema são responsabilidade de quem chama: a tela só manda as
       que interpretarLote() aprovou. */
    lancarCalibracoesEmLote: function (linhas) {
      var aplicados = [];
      (linhas || []).forEach(function (l) {
        var i = util.porId(estado.instrumentos, l.instrumentoId);
        if (!i || !l.data) return;

        var registro = {
          id: util.id('CAL'),
          data: l.data,
          resultado: 'APROVADO',
          certificado: (l.certificado || '').trim(),
          laboratorio: (l.laboratorio || '').trim(),
          proximaCalibracao: '',
          observacao: l.observacao || 'Bulk entry from the calibration spreadsheet.',
          registradoEm: util.hoje()
        };
        i.historico = i.historico || [];
        i.historico.push(registro);
        i.ultimaCalibracao = registro.data;
        i.ultimoResultado = 'APROVADO';
        if (registro.certificado) i.certificado = registro.certificado;
        if (registro.laboratorio) i.laboratorio = registro.laboratorio;
        i.periodicidadeMeses = i.periodicidadeMeses || 12;
        i.proximaCalibracao = TC.calibracao.somaMeses(registro.data, i.periodicidadeMeses);
        /* A situação não muda no lote, ao contrário do registro individual: quem está
           "being calibrated" hoje continua em calibração, mesmo lançando a data anterior. */
        aplicados.push(i.id);
      });

      if (aplicados.length) commit();
      return { ok: true, aplicados: aplicados };
    },

    /* ---- Documentos ----

       O anexo é um link para onde o arquivo já está — SharePoint, OneDrive, rede. Vale
       para demanda e para instrumento; o resto da regra está em src/documentos.js. */
    anexarDocumento: function (alvo, registroId, dados) {
      var lista = alvo === 'instrumento' ? estado.instrumentos : estado.demandas;
      var registro = util.porId(lista || [], registroId);
      if (!registro) return { ok: false, motivo: 'Record not found.' };

      var criado = TC.documentos.criar(dados, TC.permissoes.perfilAtual(estado));
      if (!criado.ok) return criado;

      registro.documentos = registro.documentos || [];
      registro.documentos.push(criado.documento);
      commit();
      return { ok: true, documento: criado.documento, registro: registro };
    },

    removerDocumento: function (alvo, registroId, documentoId) {
      var lista = alvo === 'instrumento' ? estado.instrumentos : estado.demandas;
      var registro = util.porId(lista || [], registroId);
      if (!registro) return { ok: false, motivo: 'Record not found.' };
      registro.documentos = (registro.documentos || []).filter(function (d) {
        return d.id !== documentoId;
      });
      commit();
      return { ok: true, registro: registro };
    },

    /* ---- Peças ---- */
    salvarPeca: function (peca) {
      var existente = peca.id ? util.porId(estado.pecas, peca.id) : null;
      if (existente) {
        Object.keys(peca).forEach(function (k) { existente[k] = peca[k]; });
      } else {
        peca.id = peca.id || util.id('PC');
        estado.pecas.push(peca);
      }
      commit();
      return peca;
    },
    removerPeca: function (id) {
      estado.pecas = estado.pecas.filter(function (p) { return p.id !== id; });
      commit();
    },

    /* ---- Clientes ---- */
    salvarCliente: function (cliente) {
      var existente = cliente.id ? util.porId(estado.clientes, cliente.id) : null;
      if (existente) {
        Object.keys(cliente).forEach(function (k) { existente[k] = cliente[k]; });
      } else {
        cliente.id = cliente.id || util.id('CLI');
        estado.clientes.push(cliente);
      }
      commit();
      return cliente;
    },
    removerCliente: function (id) {
      estado.clientes = estado.clientes.filter(function (c) { return c.id !== id; });
      /* O cliente sai também das listas de exigência dos procedimentos, senão o
         catálogo passa a filtrar por um cliente que não existe mais. */
      estado.testes.forEach(function (t) {
        if (t.clientes) t.clientes = t.clientes.filter(function (c) { return c !== id; });
      });
      commit();
    },

    /* ---- Perfil e permissões ---- */
    /* Hourly rate do centro de testes: um campo só, aplicado a todo o catálogo.
       Cotações já arquivadas guardam o rate do dia e não são afetadas. */
    definirHourlyRate: function (valor, vigencia) {
      estado.hourlyRate = Number(valor) || 0;
      if (typeof vigencia === 'string') estado.hourlyRateVigencia = vigencia.trim();
      commit();
      return estado.hourlyRate;
    },
    definirPerfil: function (perfilId) {
      estado.perfilAtual = perfilId;
      commit();
    },
    /* editar implica ver: quem edita precisa enxergar a janela. */
    definirPermissao: function (rota, acao, perfilId, permitido) {
      var regra = estado.permissoes[rota];
      if (!regra) return;
      function ligar(lista, ligado) {
        var i = lista.indexOf(perfilId);
        if (ligado && i === -1) lista.push(perfilId);
        if (!ligado && i !== -1) lista.splice(i, 1);
      }
      ligar(regra[acao], permitido);
      if (acao === 'editar' && permitido) ligar(regra.ver, true);
      if (acao === 'ver' && !permitido) ligar(regra.editar, false);
      commit();
    },
    restaurarPermissoes: function () {
      estado.permissoes = JSON.parse(JSON.stringify(TC.data.PERMISSOES_PADRAO));
      commit();
    },

    /* ---- Cotações ---- */
    proximoNumeroCotacao: function () {
      var ano = util.hoje().slice(0, 4);
      var prefixo = 'COT-' + ano + '-';
      var maior = 0;
      estado.cotacoes.forEach(function (c) {
        if (c.numero && c.numero.indexOf(prefixo) === 0) {
          var n = parseInt(c.numero.slice(prefixo.length), 10);
          if (!isNaN(n) && n > maior) maior = n;
        }
      });
      return prefixo + String(maior + 1).padStart(4, '0');
    },
    salvarCotacao: function (cotacao) {
      var existente = cotacao.id ? util.porId(estado.cotacoes, cotacao.id) : null;
      if (existente) {
        Object.keys(cotacao).forEach(function (k) { existente[k] = cotacao[k]; });
        commit();
        return existente;
      }
      cotacao.id = util.id('COT');
      cotacao.numero = cotacao.numero || store.proximoNumeroCotacao();
      cotacao.criadoEm = cotacao.criadoEm || util.hoje();

        (permissoes.podeEditarCatalogo
          ? '<button class="botao pequeno editar" title="Edit procedure">Edit</button>' : '') +
        (!permissoes.podeCriarDemanda && !permissoes.podeEditarCatalogo ? '<span class="sub">—</span>' : '') +
      '</td>' +
    '</tr>';
  }

  /* ---- Confirmation of need form ---- */

  function abrirConfirmacao(ctx, teste) {
    var estado = ctx.estado;
    var eqs = gruposDe(estado, teste);
    var nomes = eqs.lista.map(function (g) { return g.nome; }).join(' + ');
    var unidadesRef = eqs.lista.map(function (g) { return g.membros[0]; });
    var temPool = eqs.lista.some(function (g) { return g.membros.length > 1; });

    var clientePadrao = ctx.filtros.clienteId ||
      (teste.clientes && teste.clientes[0]) ||
      (estado.clientes[0] && estado.clientes[0].id) || '';

    var tipoPadrao = ctx.filtros.tipoLti || 'DV';
    var amostrasPadrao = util.hoje();
    var prazoPadrao = util.somaDias(util.hoje(), 60);

    /* Projects already used become suggestions, so the same programme does not end up
       spelled three different ways. */
    var projetosConhecidos = [];
    estado.demandas.forEach(function (d) {
      if (d.projeto && projetosConhecidos.indexOf(d.projeto) === -1) projetosConhecidos.push(d.projeto);
    });

    /* A newly registered procedure may still have no rig and no hours. The request is
       recorded anyway — the need exists — but without those the scheduler has nothing to
       place, so the warning says where to complete it. */
    var identificacao = e(teste.nome) + (teste.revisao ? ' · ' + e(teste.revisao) : '') +
      ' · ' + e(teste.norma || 'no standard');
    var incompleto = !eqs.lista.length || !TC.scheduler.horasDeBancada(teste);

    var corpo =
      (incompleto
        ? '<div class="aviso alerta">' + identificacao +
            ' — this procedure still has <strong>no ' +
            (!eqs.lista.length ? 'equipment' : '') +
            (!eqs.lista.length && !TC.scheduler.horasDeBancada(teste) ? ' and no ' : '') +
            (!TC.scheduler.horasDeBancada(teste) ? 'rig hours' : '') +
            '</strong> in the catalogue. The request is recorded, but it only enters the ' +
            'calendar once the procedure register is completed.</div>'
        : '<div class="aviso">' + identificacao + ' · takes <strong>' +
            e(nomes) + '</strong> for ' +
            e(TC.scheduler.diasDeOperacao(teste, unidadesRef) + ' day(s)') +
            (eqs.lista.length > 1 ? ', with all ' + eqs.lista.length + ' groups reserved at once' : '') +
            '. The start date is worked out automatically from the sample arrival and the equipment calendar' +
            (temPool ? ', picking the unit that frees up first' : '') + '.' +
          '</div>') +
      '<p class="sub" style="margin:0 0 12px">Every field is required except ' +
        '<strong>force start</strong>.</p>' +
      '<div class="grade-campos">' +
        '<div class="campo"><label>LTI no. (work order)</label>' +
          '<input name="lti" placeholder="e.g. LTI-2026-0142" autocomplete="off"></div>' +
        '<div class="campo"><label>LTI classification</label><select name="tipoLti">' +
          ui.opcoes(TC.data.TIPOS_LTI, tipoPadrao) + '</select></div>' +
        '<div class="campo"><label>Customer</label><select name="clienteId">' +
          ui.opcoes(estado.clientes, clientePadrao) + '</select></div>' +
        '<div class="campo"><label>Project</label>' +
          '<input name="projeto" list="projetos-conhecidos" autocomplete="off" placeholder="e.g. MQB-A0 / EA211">' +
          '<datalist id="projetos-conhecidos">' +
            projetosConhecidos.map(function (p) { return '<option value="' + e(p) + '"></option>'; }).join('') +
          '</datalist></div>' +
        '<div class="campo"><label>Part Number</label>' +
          '<input name="partNumber" autocomplete="off" placeholder="e.g. 04E253011AB"></div>' +
        '<div class="campo"><label>Part type to test</label><select name="pecaId">' +
          ui.opcoes(estado.pecas, '') + '</select></div>' +
        '<div class="campo"><label>Samples available from</label>' +
          '<input type="date" name="dataAmostras" value="' + e(amostrasPadrao) + '"></div>' +
        '<div class="campo"><label>Due date</label>' +
          '<input type="date" name="prazo" value="' + e(prazoPadrao) + '"></div>' +
        '<div class="campo"><label>Priority</label><select name="prioridade">' +
          ui.opcoes(TC.data.PRIORIDADES, 'MEDIA') + '</select></div>' +
        '<div class="campo"><label>Samples to consume</label>' +
          '<input type="number" name="quantidade" min="1" value="' + e(String(teste.amostras)) + '"></div>' +
        '<div class="campo"><label>Force start on <span class="sub" style="font-weight:400">(optional)</span></label>' +
          '<input type="date" name="inicioFixo"></div>' +
      '</div>' +
      '<div class="campo"><label>Note</label>' +
        '<textarea name="observacao" rows="2" placeholder="e.g. repeat with alternative material"></textarea></div>' +
      '<div class="campo" id="previa"></div>';

    var janela = ui.modal({
      titulo: 'Confirm test need',
      corpo: corpo,
      confirmar: 'Confirm and schedule',
      aoConfirmar: function (v) {
        if (!ui.validarObrigatorios(janela, v, [
          { nome: 'lti', rotulo: 'the LTI number' },
          { nome: 'tipoLti', rotulo: 'the LTI classification' },
          { nome: 'clienteId', rotulo: 'the customer' },
          { nome: 'projeto', rotulo: 'the project' },
          { nome: 'partNumber', rotulo: 'the part number' },
          { nome: 'pecaId', rotulo: 'the part type to test' },
          { nome: 'dataAmostras', rotulo: 'the date the samples become available' },
          { nome: 'prazo', rotulo: 'the due date' },
          { nome: 'prioridade', rotulo: 'the priority' },
          { nome: 'quantidade', rotulo: 'the number of samples', tipo: 'numero', min: 1 },
          { nome: 'observacao', rotulo: 'the note' }
        ])) return false;

        var demanda = TC.store.criarDemanda({
          testeId: teste.id, pecaId: v.pecaId, clienteId: v.clienteId,
          projeto: v.projeto, partNumber: v.partNumber,
          lti: v.lti, tipoLti: v.tipoLti,
          prioridade: v.prioridade, quantidade: v.quantidade,
          dataAmostras: v.dataAmostras, prazo: v.prazo,
          inicioFixo: v.inicioFixo, observacao: v.observacao
        });
        var plano = TC.scheduler.planejar(TC.store.get());
        var alocacao = plano.alocacoes.filter(function (a) { return a.demandaId === demanda.id; })[0];
        if (alocacao && alocacao.cotacao) {
          ui.notificar('Quote recorded — cost estimated without reserving a rig.');
          ctx.ir('demandas');
          return;
        }
        if (alocacao && alocacao.inicio) {
          ui.notificar('Scheduled on ' + alocacao.equipamentos.map(function (eq) { return eq.nome; }).join(' + ') + ': ' +
            util.formatarData(alocacao.inicio, true) + ' → ' + util.formatarData(alocacao.fim, true));
        } else {
          ui.notificar('Request created, but with no slot available — check the schedule.');
        }
        ctx.ir('planejamento');
      }
    });

    var selPeca = janela.querySelector('[name=pecaId]');
    var previa = janela.querySelector('#previa');
    var botaoConfirmar = janela.querySelector('.confirmar');
    var campoAmostras = janela.querySelector('[name=dataAmostras]');

    function atualizarPrevia() {
      var peca = util.porId(estado.pecas, selPeca.value);
      var qtd = Number(janela.querySelector('[name=quantidade]').value) || teste.amostras;
      var custo = TC.scheduler.custoDemanda({ quantidade: qtd }, teste, null, peca, estado.hourlyRate);
      var cotacao = selTipo.value === 'COTACAO';
      previa.innerHTML =
        '<div class="aviso alerta"><strong>Estimated cost ' + e(util.formatarMoeda(custo.total)) + '</strong> — ' +
        e(String(custo.horasFaturaveis)) + ' h (' + e(String(custo.horasBancada)) + ' on the rig + ' +
        e(String(custo.horasReport)) + ' reporting) x ' + e(util.formatarTaxa(custo.hourlyRate)) + '/h = ' +
        e(util.formatarMoeda(custo.custoHoras)) +
        ' + consumables ' + e(util.formatarMoeda(custo.custoInsumos)) +
        ' + ' + e(String(qtd)) + ' sample(s) ' + e(util.formatarMoeda(custo.custoAmostras)) +
        (cotacao
          ? '. As a quote, it reserves no rig and stays out of the schedule.'
          : '. The test is not scheduled before ' + e(util.formatarData(campoAmostras.value, true)) + '.') +
        '</div>';
    }

    function atualizarTipo() {
      botaoConfirmar.textContent = selTipo.value === 'COTACAO' ? 'Record quote' : 'Confirm and schedule';
      atualizarPrevia();
    }

    var selTipo = janela.querySelector('[name=tipoLti]');

    selPeca.addEventListener('change', atualizarPrevia);
    selTipo.addEventListener('change', atualizarTipo);
    campoAmostras.addEventListener('change', atualizarPrevia);
    janela.querySelector('[name=quantidade]').addEventListener('input', atualizarPrevia);
    atualizarTipo();
  }

  /* ---- Procedure form ---- */

  function abrirEdicao(ctx, teste) {
    var estado = ctx.estado;
    var novo = !teste;
    teste = teste || { id: '', nome: '', norma: '', revisao: 'Rev. 01', area: 'COLD', clientes: [], equipamentoGrupos: [], horasSetup: 2, horasEnsaio: 24, horasReport: 4, amostras: 2, custoInsumos: 0, descricao: '' };
    var gruposAtuais = TC.scheduler.gruposDoTeste(teste);
    var parque = TC.scheduler.agruparEquipamentos(estado.equipamentos);

    var corpo =
      '<p class="sub" style="margin:0 0 12px">Every field is required. The exception is ' +
        '<strong>required by customers</strong>: leaving it blank marks the procedure as a lab ' +
        'standard, valid for everyone.</p>' +
      '<div class="grade-campos">' +
        '<div class="campo"><label>Code</label><input name="id" value="' + e(teste.id) + '"' +
          (novo ? ' placeholder="TP-GM-12"' : ' readonly') + '></div>' +
        '<div class="campo"><label>Procedure name</label><input name="nome" value="' + e(teste.nome) + '" required></div>' +
        '<div class="campo"><label>Standard / reference</label><input name="norma" value="' + e(teste.norma || '') + '"></div>' +
        '<div class="campo"><label>Procedure revision</label>' +
          '<input name="revisao" value="' + e(teste.revisao || '') + '" placeholder="e.g. Rev. 03"></div>' +
        '<div class="campo"><label>System end</label><select name="area">' +
          ui.opcoes(TC.data.AREAS, teste.area) + '</select></div>' +
        '<div class="campo"><label>Setup hours</label><input type="number" name="horasSetup" min="0" step="0.5" value="' + e(String(teste.horasSetup)) + '"></div>' +
        '<div class="campo"><label>Test hours</label><input type="number" name="horasEnsaio" min="0" step="0.5" value="' + e(String(teste.horasEnsaio)) + '"></div>' +
        '<div class="campo"><label>Reporting hours</label><input type="number" name="horasReport" min="0" step="0.5" value="' + e(String(teste.horasReport || 0)) + '"></div>' +
        '<div class="campo"><label>Consumables cost (R$)</label><input type="number" name="custoInsumos" min="0" step="100" value="' + e(String(teste.custoInsumos || 0)) + '"></div>' +
        '<div class="campo"><label>Samples required</label><input type="number" name="amostras" min="1" value="' + e(String(teste.amostras)) + '"></div>' +
      '</div>' +
      '<div class="campo" id="previa-custo"></div>' +
      '<div class="campo"><label>Equipment the test occupies ' +
        '<span class="sub" style="font-weight:400">(tick more than one if the test holds the rigs at the same time; ' +
        'in a group with several units, the scheduler picks the one that frees up first)</span></label><div>' +
        parque.map(function (g) {
          return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-weight:500;color:var(--texto)">' +
            '<input type="checkbox" name="equipamentoGrupos" data-grupo="1" value="' + e(g.id) + '" style="width:auto"' +
            (gruposAtuais.indexOf(g.id) !== -1 ? ' checked' : '') + '>' + e(g.nome) +
            (g.membros.length > 1 ? ' <span class="sub">(' + g.membros.length + ')</span>' : '') + '</label>';
        }).join('') +
      '</div></div>' +
      '<div class="campo"><label>Required by customers (none = lab standard procedure)</label><div>' +
        estado.clientes.map(function (c) {
          return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-weight:500;color:var(--texto)">' +
            '<input type="checkbox" name="clientes" data-grupo="1" value="' + e(c.id) + '" style="width:auto"' +
            ((teste.clientes || []).indexOf(c.id) !== -1 ? ' checked' : '') + '>' + e(c.nome) + '</label>';
        }).join('') +
      '</div></div>' +
      '<div class="campo"><label>Description</label><textarea name="descricao" rows="2">' + e(teste.descricao || '') + '</textarea></div>';

    var janela = ui.modal({
      titulo: novo ? 'New procedure' : 'Edit ' + teste.id,
      corpo: corpo,
      confirmar: 'Save procedure',
      aoConfirmar: function (v) {
        if (!ui.validarObrigatorios(janela, v, [
          { nome: 'id', rotulo: 'the procedure code' },
          { nome: 'nome', rotulo: 'the procedure name' },
          { nome: 'norma', rotulo: 'the standard / reference' },
          { nome: 'revisao', rotulo: 'the procedure revision' },
          { nome: 'area', rotulo: 'the system end' },
          { nome: 'horasSetup', rotulo: 'the setup hours', tipo: 'numero' },
          { nome: 'horasEnsaio', rotulo: 'the test hours', tipo: 'numero', min: 0.5 },
          { nome: 'horasReport', rotulo: 'the reporting hours', tipo: 'numero' },
          { nome: 'custoInsumos', rotulo: 'the consumables cost', tipo: 'numero' },
          { nome: 'amostras', rotulo: 'the samples required', tipo: 'numero', min: 1 },
          { nome: 'descricao', rotulo: 'the description' }
        ])) return false;

        if (!v.equipamentoGrupos || !v.equipamentoGrupos.length) {
          ui.notificar('Select at least one piece of equipment.');
          return false;
        }
        if (novo && util.porId(estado.testes, v.id.trim())) {
          ui.notificar('A procedure with code ' + v.id.trim() + ' already exists.');
          janela.querySelector('[name=id]').focus();
          return false;
        }
        TC.store.salvarTeste({
          id: v.id.trim(), nome: v.nome.trim(), norma: v.norma.trim(), revisao: v.revisao.trim(),
          area: v.area, equipamentoGrupos: v.equipamentoGrupos, clientes: v.clientes || [],
          horasSetup: Number(v.horasSetup) || 0, horasEnsaio: Number(v.horasEnsaio) || 0,
          horasReport: Number(v.horasReport) || 0, amostras: Number(v.amostras) || 1,
          custoInsumos: Number(v.custoInsumos) || 0,
          descricao: v.descricao.trim()
        });
        ui.notificar('Procedure saved.');
      }
    });

    /* The cost breakdown shows as you type, so the register never becomes a black box. */
    var previaCusto = janela.querySelector('#previa-custo');
    function atualizarCusto() {
      function num(campo) { return Number(janela.querySelector('[name=' + campo + ']').value) || 0; }
      var horasBancada = num('horasSetup') + num('horasEnsaio');
      var horasReport = num('horasReport');
      var horas = horasBancada + horasReport;
      var rate = TC.scheduler.taxaHoraria(estado);
      var insumos = num('custoInsumos');
      previaCusto.innerHTML =
        '<div class="aviso"><strong>Procedure cost ' +
        e(util.formatarMoeda(horas * rate + insumos)) + '</strong> — (' +
        e(String(horasBancada)) + ' h on the rig + ' + e(String(horasReport)) + ' h reporting) × ' +
        e(util.formatarTaxa(rate)) + '/h = ' + e(util.formatarMoeda(horas * rate)) +
        ' + consumables ' + e(util.formatarMoeda(insumos)) +
        '. The hourly rate belongs to the test centre and is the same across the catalogue. ' +
        'Samples come in later, on the request.</div>';
    }
    ['horasSetup', 'horasEnsaio', 'horasReport', 'custoInsumos'].forEach(function (campo) {
      janela.querySelector('[name=' + campo + ']').addEventListener('input', atualizarCusto);
    });
    atualizarCusto();
  }

  /* ---- Test centre hourly rate ---- */

  /* A single value for the whole catalogue, updated once a year. It used to be a field on
     each procedure, which meant editing dozens of records at every revision. */
  function abrirHourlyRate(ctx) {
    var estado = ctx.estado;
    var comHoras = estado.testes.filter(function (t) {
      return TC.scheduler.horasFaturaveis(t) > 0;
    }).length;

    var janela = ui.modal({
      titulo: 'Test centre hourly rate',
      corpo:
        '<div class="aviso">It applies to the <strong>' + estado.testes.length +
          ' procedures</strong> in the catalogue (' + comHoras + ' already with measured hours). ' +
          'Archived quotes keep the rate of the day they were made and ' +
          '<strong>do not change</strong> with this revision.</div>' +
        '<div class="grade-campos">' +
          '<div class="campo"><label>Hourly rate (R$/h)</label>' +
            '<input type="number" name="hourlyRate" min="0" step="0.01" value="' +
            e(String(estado.hourlyRate)) + '"></div>' +
          '<div class="campo"><label>In force for</label>' +
            '<input name="vigencia" placeholder="e.g. 2026" value="' +
            e(estado.hourlyRateVigencia || '') + '"></div>' +
        '</div>' +
        '<div class="campo" id="previa-rate"></div>',
      confirmar: 'Save hourly rate',
      aoConfirmar: function (v) {
        if (!ui.validarObrigatorios(janela, v, [
          { nome: 'hourlyRate', rotulo: 'the hourly rate', tipo: 'numero', min: 0.01 },
          { nome: 'vigencia', rotulo: 'the period it is in force for' }
        ])) return false;
        TC.store.definirHourlyRate(v.hourlyRate, v.vigencia);
        ui.notificar('Hourly rate updated across the catalogue.');
      }
    });

    /* Shows the effect on the whole package at once: it is the number that justifies the
       rate. */
    var previa = janela.querySelector('#previa-rate');
    var campo = janela.querySelector('[name=hourlyRate]');
    function atualizar() {
      var rate = Number(campo.value) || 0;
      var total = estado.testes.reduce(function (soma, t) {
        return soma + TC.scheduler.custoCatalogo(t, rate).custoProcedimento;
      }, 0);
      previa.innerHTML = '<div class="aviso alerta">At this rate, running the whole catalogue ' +
        'once costs <strong>' + e(util.formatarMoeda(total)) + '</strong>.</div>';
    }
    campo.addEventListener('input', atualizar);
    atualizar();
  }

  function render(container, ctx) {
    var estado = ctx.estado, f = ctx.filtros;
    var lista = filtrar(estado, f);
    var permissoes = {
      podeEditarCatalogo: ctx.podeEditar,
      podeCriarDemanda: TC.permissoes.podeEditar(estado, 'demandas')
    };

    var totalHoras = 0, totalCusto = 0;
    lista.forEach(function (t) {
      var c = TC.scheduler.custoCatalogo(t, estado.hourlyRate);
      totalHoras += c.horasBancada; totalCusto += c.total;
    });

    container.innerHTML =
      '<div class="cabecalho">' +
        '<div><h2>Test catalogue</h2>' +
        '<p>Every validation procedure by system end and customer, with its current revision, rig time and cost. Any procedure can run in any project phase. Confirm the need for a test and it enters the schedule automatically.</p></div>' +
        (permissoes.podeEditarCatalogo
          ? '<div class="acoes"><button class="botao primario" id="novo">+ New procedure</button></div>' : '') +
      '</div>' +
      '<div class="indicadores">' +
        '<div class="indicador"><div class="rotulo">Procedures listed</div><div class="valor">' + lista.length +
          '</div><div class="nota">of ' + estado.testes.length + ' in the catalogue</div></div>' +
        '<div class="indicador"><div class="rotulo">Total rig time</div><div class="valor">' +
          Math.round(totalHoras) + ' h</div><div class="nota">if every one ran once</div></div>' +
        '<div class="indicador"><div class="rotulo">Package cost</div><div class="valor">' +
          util.formatarMoeda(totalCusto) + '</div><div class="nota">excluding sample cost</div></div>' +
        /* The hourly rate belongs to the test centre, not to the procedure: a single field
           that applies to every procedure and changes once a year. */
        '<div class="indicador"><div class="rotulo">Hourly rate</div><div class="valor">' +
          util.formatarTaxa(estado.hourlyRate) + '<span class="sub" style="font-size:13px">/h</span></div>' +
          '<div class="nota">in force ' + e(estado.hourlyRateVigencia || '—') + ' · applies to the whole catalogue' +
          (permissoes.podeEditarCatalogo
            ? ' · <button class="botao pequeno" id="editar-rate" style="margin-top:6px">Change</button>'
            : '') + '</div></div>' +
      '</div>' +
      '<div class="cartao">' +
        '<div class="cartao-topo"><div class="filtros" style="flex:1">' +
          '<div class="campo busca"><label>Search</label><input id="f-busca" placeholder="name, code, standard or revision" value="' + e(f.busca || '') + '"></div>' +
          '<div class="campo"><label>Customer</label><select id="f-cliente">' + ui.opcoes(estado.clientes, f.clienteId, 'All') + '</select></div>' +
          '<div class="campo"><label>End</label><select id="f-area">' + ui.opcoes(TC.data.AREAS.filter(function (a) { return a.id !== 'AMBOS'; }), f.area, 'Hot + Cold') + '</select></div>' +
          '<div class="campo"><label>Equipment</label><select id="f-equip">' +
            ui.opcoes(TC.scheduler.agruparEquipamentos(estado.equipamentos), f.equipamentoId, 'All') + '</select></div>' +
        '</div></div>' +
        (lista.length ? '<div class="tabela-rolagem"><table><thead><tr>' +
          '<th>Code</th><th>Procedure</th><th>Revision</th><th>End</th><th>Equipment</th>' +
          '<th class="num">Duration</th><th class="num">Samples</th><th class="num">Estimated cost</th><th></th>' +
          '</tr></thead><tbody>' + lista.map(function (t) { return linha(estado, t, permissoes); }).join('') +
          '</tbody></table></div>'
          : ui.vazio('No procedure found', 'Adjust the filters or register a new procedure.')) +
      '</div>';

    var botaoNovo = container.querySelector('#novo');
    if (botaoNovo) botaoNovo.onclick = function () { abrirEdicao(ctx, null); };

    var botaoRate = container.querySelector('#editar-rate');
    if (botaoRate) botaoRate.onclick = function () { abrirHourlyRate(ctx); };

    function liga(id, campo) {
      var alvo = container.querySelector(id);
      alvo.addEventListener(alvo.tagName === 'SELECT' ? 'change' : 'input', function () {
        f[campo] = alvo.value;
        ctx.atualizar();
      });
    }
    liga('#f-cliente', 'clienteId');
    liga('#f-area', 'area');
    liga('#f-equip', 'equipamentoId');

    var busca = container.querySelector('#f-busca');
    var atraso;
    busca.addEventListener('input', function () {
      clearTimeout(atraso);

  <script>

  function montarItem(teste, amostras, hourlyRate) {

    return {
      testeId: teste.id,
      nome: teste.nome,
      revisao: teste.revisao || '',
      norma: teste.norma || '',

      horasFaturaveis: custo.horasFaturaveis,
      hourlyRate: custo.hourlyRate,
      custoHoras: custo.custoHoras,
      custoInsumos: custo.custoInsumos,
      custoUnitario: custo.custoProcedimento,
      amostras: quantidade,

          '<td class="num">' + e(util.formatarMoeda(i.custoInsumos)) + '</td>' +

      '</tr></tfoot></table></div>';

  function exportarExcel(estado, cotacao) {
    var cliente = util.porId(estado.clientes, cotacao.clienteId);

    var cabecalho = [
      ['Quote', cotacao.numero],
      ['LTI', cotacao.lti || ''],
      ['Customer', cliente ? cliente.nome : cotacao.clienteId],
      ['Project', cotacao.projeto || ''],

      ['Requested by', cotacao.solicitante || ''],

      ['Date', util.formatarData(cotacao.criadoEm, true)],
      ['Status', nomeStatus(cotacao.status)],

    var titulos = ['Code', 'Procedure', 'Revision', 'Standard', 'Rig hours',
      'Reporting hours', 'Billable hours', 'Hourly rate', 'Hours cost', 'Consumables',
      'Unit cost', 'Samples', 'Total'];

    var linhas = cotacao.itens.map(function (i) {
      return [i.testeId, i.nome, i.revisao, i.norma, i.horasBancada, i.horasReport,
        i.horasFaturaveis, i.hourlyRate, i.custoHoras, i.custoInsumos,
        i.custoUnitario, i.amostras || i.quantidade || 1, i.total];

    linhas.push([]);
    linhas.push(['', 'QUOTE TOTAL', '', '', '', '', '', '', '', '', '', '',

  /* ---- Viewing an archived quote ---- */

    var corpo =
      '<div class="aviso">' +
        '<strong>' + e(cotacao.numero) + '</strong>' +
        (cotacao.lti ? ' · LTI ' + e(cotacao.lti) : '') +
        ' · ' + e(cliente ? cliente.nome : '—') +
        (cotacao.projeto ? ' · ' + e(cotacao.projeto) : '') +
        (cotacao.partNumber ? ' · ' + e(cotacao.partNumber) : '') +
        '<div class="sub" style="margin-top:4px">' +
          'Requested by: ' + e(cotacao.solicitante || '—') +
          ' · issued on ' + e(util.formatarData(cotacao.criadoEm, true)) +
          (cotacao.previsaoExecucao

    botaoExcel.onclick = function () { exportarExcel(estado, cotacao); };
    pe.insertBefore(botaoExcel, pe.firstChild);
  }

  /* ---- New quote ---- */

  function abrirNova(ctx) {
    var estado = ctx.estado;

    function distintos(lista) {
      var vistos = [];
      lista.forEach(function (v) { if (v && vistos.indexOf(v) === -1) vistos.push(v); });
      return vistos;
    }

    var projetosConhecidos = distintos(
      estado.demandas.concat(estado.cotacoes).map(function (d) { return d.projeto; }));

    /* LTIs already used on requests and quotes become a filter and a suggestion. */
    var ltisConhecidas = distintos(

      '<p class="sub" style="margin:0 0 12px">Pick the procedures to price. The cost of each one ' +

        '<div class="campo"><label>Part Number</label>' +
          '<input name="partNumber" autocomplete="off" placeholder="e.g. 04E253011AB"></div>' +
        '<div class="campo"><label>Requested by</label>' +
          '<input name="solicitante" autocomplete="off" placeholder="Who asked for the quote"></div>' +
        '<div class="campo"><label>Planned execution</label>' +
          '<input type="date" name="previsaoExecucao" value="' + e(util.somaDias(util.hoje(), 30)) + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Note</label>' +

          '<div class="campo"><select id="f-lti-teste">' +
            '<option value="">All LTIs</option>' +

          { nome: 'projeto', rotulo: 'the project' },

    campoBusca.addEventListener('input', aplicarFiltros);
    filtroCliente.addEventListener('change', aplicarFiltros);
    filtroLti.addEventListener('change', aplicarFiltros);

    aplicarFiltros();
    atualizarResumo();
  }

/* Equipment: capacity, calendar and maintenance downtime.

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  var SEMANA = [
    { valor: 1, nome: 'Mon' }, { valor: 2, nome: 'Tue' }, { valor: 3, nome: 'Wed' },

      var dias = util.diffDias(inicio, a.fim) + 1;

    if (registroId) {
      var doRegistro = docs.filter(function (d) { return d.refId === registroId; });
      if (doRegistro.length) return doRegistro[0];
      return null;

  function etiquetaSituacao(id) {
