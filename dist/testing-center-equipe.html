    var filtroLti = janela.querySelector('#f-lti-teste');

    function coletarItens() {
      var itens = [];
      janela.querySelectorAll('.linha-selecao').forEach(function (linha) {
        if (!linha.querySelector('.marcar').checked) return;
        var teste = util.porId(estado.testes, linha.dataset.teste);
        if (teste) {
          itens.push(montarItem(teste, linha.querySelector('.qtd').value, estado.hourlyRate));
        }
      });
      return itens;
    }

    /* Um procedimento sem cliente marcado é padrão do laboratório: vale para todos. */
    function atendeCliente(teste, clienteId) {
      if (!clienteId) return true;
      return !teste.clientes || !teste.clientes.length || teste.clientes.indexOf(clienteId) !== -1;
    }

    function aplicarFiltros() {
      var busca = campoBusca.value.trim().toLowerCase();
      var cliente = filtroCliente.value;
      var lti = filtroLti.value;
      var visiveis = 0;

      janela.querySelectorAll('.linha-selecao').forEach(function (linha) {
        var teste = util.porId(estado.testes, linha.dataset.teste);
        var marcado = linha.querySelector('.marcar').checked;
        var passa = !!teste;

        if (passa && busca) {
          var alvo = (teste.id + ' ' + teste.nome + ' ' + (teste.norma || '') + ' ' +
            (teste.revisao || '')).toLowerCase();
          passa = alvo.indexOf(busca) !== -1;
        }
        if (passa && cliente) passa = atendeCliente(teste, cliente);
        if (passa && lti) passa = !!(testesPorLti[lti] && testesPorLti[lti][teste.id]);

        /* O que já foi marcado continua visível, para não sumir da conta sem aviso. */
        linha.style.display = (passa || marcado) ? '' : 'none';
        if (passa || marcado) visiveis++;
      });

      var vazio = janela.querySelector('#lista-vazia');
      if (vazio) vazio.remove();
      if (!visiveis) {
        janela.querySelector('#lista-testes').insertAdjacentHTML('afterend',
          '<div id="lista-vazia" class="sub" style="padding:8px 2px">' +
          'Nenhum procedimento com esses filtros.</div>');
      }
    }

    function atualizarResumo() {
      var itens = coletarItens();
      if (!itens.length) {
        resumo.innerHTML = '<div class="aviso">Nenhum teste selecionado ainda.</div>';
        return;
      }
      var total = itens.reduce(function (s, i) { return s + i.total; }, 0);
      var amostras = itens.reduce(function (s, i) { return s + i.amostras; }, 0);
      resumo.innerHTML = '<div class="aviso alerta"><strong>' + itens.length +
        ' teste(s) · ' + amostras + ' amostra(s) · ' + e(util.formatarMoeda(total)) + '</strong></div>';
    }

    janela.querySelectorAll('.linha-selecao').forEach(function (linha) {
      var marcar = linha.querySelector('.marcar');
      var qtd = linha.querySelector('.qtd');
      marcar.addEventListener('change', function () {
        qtd.disabled = !marcar.checked;
        linha.classList.toggle('marcada', marcar.checked);
        atualizarResumo();
      });
      qtd.addEventListener('input', atualizarResumo);
    });

    /* Os filtros começam neutros e só mudam quando o usuário mexe neles. Herdar o cliente
       da cotação escondia procedimentos sem pedido e, combinado com o filtro de LTI,
       chegava a esvaziar a lista sem explicação. */
    campoBusca.addEventListener('input', aplicarFiltros);
    filtroCliente.addEventListener('change', aplicarFiltros);
    filtroLti.addEventListener('change', aplicarFiltros);

    aplicarFiltros();
    atualizarResumo();
  }

  /* ---- Tela ---- */

  function render(container, ctx) {
    var estado = ctx.estado;
    var podeEditar = TC.permissoes.podeEditar(estado, 'cotacoes');
    var lista = estado.cotacoes.slice().sort(function (a, b) {
      return util.diffDias(b.criadoEm, a.criadoEm) || (a.numero < b.numero ? 1 : -1);
    });

    var perfilAtual = TC.permissoes.perfilAtual(estado);
    var EM_ANDAMENTO = ['RASCUNHO', 'SOLICITADA', 'EM_ANALISE', 'DEVOLVIDA', 'VALIDADA'];

    var totalGeral = 0, aprovadas = 0, emAberto = 0;
    lista.forEach(function (c) {
      var t = totalDaCotacao(c);
      totalGeral += t;
      if (c.status === 'APROVADA') aprovadas += t;
      if (EM_ANDAMENTO.indexOf(c.status) !== -1) emAberto += t;
    });

    var linhas = lista.map(function (c) {
      var cliente = util.porId(estado.clientes, c.clienteId);

  <script>
/* Demandas: testes cuja necessidade já foi confirmada, com a janela que o motor calculou. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  function filtrar(alocacoes, f) {
    return alocacoes.filter(function (a) {
      var d = a.demanda;
      if (f.clienteId && d.clienteId !== f.clienteId) return false;
      if (f.tipoLti && d.tipoLti !== f.tipoLti) return false;
      if (f.area && a.teste && a.teste.area !== f.area && a.teste.area !== 'AMBOS') return false;
      if (f.status && d.status !== f.status) return false;
      if (f.busca) {
        var alvo = ((d.lti || '') + ' ' + (d.projeto || '') + ' ' + (d.partNumber || '') + ' ' +
          (a.teste ? a.teste.nome : '') + ' ' + (a.peca ? a.peca.nome : '')).toLowerCase();
        if (alvo.indexOf(f.busca.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  function celulaJanela(a) {
    if (a.cotacao) {
      return '<span class="etiqueta alerta">Cotação</span><div class="sub">não ocupa bancada</div>';
    }
    if (!a.inicio) {
      return '<span class="etiqueta erro">Sem janela</span><div class="sub">' + e(a.motivo || '') + '</div>';
    }
    var extras = [];
    if (a.esperaAmostra) extras.push('aguarda amostra ' + a.esperaAmostra + ' d');
    if (a.esperaFila > 0) extras.push('fila ' + a.esperaFila + ' d');

      return eq.nome + (eq.posicoes > 1 ? ' pos. ' + (a.posicoes[eq.id] + 1) : '');
    }).join(' + ');
    return '<span class="forte">' + e(util.formatarData(a.inicio, true)) + ' → ' + e(util.formatarData(a.fim, true)) + '</span>' +
      '<div class="sub">' + e(bancadas + (extras.length ? ' · ' + extras.join(' · ') : '')) + '</div>';
  }

  function celulaPrazo(a) {
    if (!a.demanda.prazo) return '<span class="sub">sem prazo</span>';
    var texto = util.formatarData(a.demanda.prazo, true);
    if (a.folga === null || a.folga === undefined) return texto;
    var etiqueta = a.folga < 0
      ? '<span class="etiqueta erro">' + Math.abs(a.folga) + ' d de atraso</span>'

  function celulaDocumentos(d) {
    var docs = d.documentos || [];
    var contas = TC.documentos.resumo(docs);
    if (!contas.total) return '<span class="sub">—</span>';
    return '<span class="etiqueta">' + contas.total + ' anexo' + (contas.total > 1 ? 's' : '') + '</span>' +
      (contas.RELATORIO ? '<div class="sub">relatório</div>' : '');

  function linha(a, podeEditar, perfil) {

      '<td>' +

  function abrirEdicao(ctx, demanda, alocacao) {

    var corpo =
      '<div class="aviso">' + e(teste ? teste.nome : demanda.testeId) +
        (teste && teste.revisao ? ' · ' + e(teste.revisao) : '') +
        (alocacao && alocacao.cotacao
          ? ' · cotação, não ocupa bancada'
          : alocacao && alocacao.inicio
          ? ' · planejado para ' + e(util.formatarData(alocacao.inicio, true)) + ' → ' + e(util.formatarData(alocacao.fim, true)) +
            ' em ' + e(alocacao.equipamentos.map(function (eq) { return eq.nome; }).join(' + '))
          : ' · ainda sem janela') +
      '</div>' +
      '<div class="grade-campos">' +
        '<div class="campo"><label>Nº da LTI (ordem de serviço)</label><input name="lti" value="' + e(demanda.lti || '') + '"></div>' +

          ui.opcoes(estado.pecas, demanda.pecaId) + '</select></div>' +
        '<div class="campo"><label>Amostras disponíveis a partir de</label>' +
          '<input type="date" name="dataAmostras" value="' + e(demanda.dataAmostras || '') + '"></div>' +
        '<div class="campo"><label>Prazo para finalização</label><input type="date" name="prazo" value="' + e(demanda.prazo || '') + '"></div>' +
        '<div class="campo"><label>Prioridade</label><select name="prioridade">' + ui.opcoes(TC.data.PRIORIDADES, demanda.prioridade) + '</select></div>' +

        if (!v.dataAmostras) {
          ui.notificar('Informe a data de disponibilidade das amostras.');
          return false;
        }
        TC.store.atualizarDemanda(demanda.id, {
          clienteId: v.clienteId, pecaId: v.pecaId, lti: v.lti.trim(), tipoLti: v.tipoLti,
          projeto: v.projeto.trim(), partNumber: v.partNumber.trim(),
          prioridade: v.prioridade, quantidade: Number(v.quantidade) || 1,
          dataAmostras: v.dataAmostras, prazo: v.prazo,

      }
    });
    /* Anexar grava na hora e redesenha só o painel — a janela segue aberta com o que já

    ui.ligarDocumentos(janela, {
      registro: demanda, contexto: 'demanda', podeEditar: ctx.podeEditar,

  function render(container, ctx) {

        (lista.length ? '<div class="tabela-rolagem"><table><thead><tr>' +

          '<th>Janela planejada</th><th>Prazo</th><th class="num">Custo</th><th>Documentos</th><th>Status</th><th></th>' +
          '</tr></thead><tbody>' + lista.map(function (a) { return linha(a, ctx.podeEditar, perfilAtual); }).join('') + '</tbody></table></div>'
          : ui.vazio('Nenhuma demanda confirmada', 'Abra o catálogo e confirme a necessidade de um teste.')) +
      '</div>';

    var irCatalogo = container.querySelector('#ir-catalogo');

    var busca = container.querySelector('#f-busca');

  function abrirEdicao(equipamento, estado) {
    var novo = !equipamento;
    equipamento = equipamento || { id: '', nome: '', grupo: '', posicoes: 1, continuo: false, horasDia: 8, diasUteis: [1, 2, 3, 4, 5], manutencao: [] };

    var gruposExistentes = TC.scheduler.agruparEquipamentos(estado.equipamentos)
      .map(function (g) { return g.id; });

    var corpo =
      '<div class="grade-campos">' +
        '<div class="campo"><label>Código</label><input name="id" value="' + e(equipamento.id) + '"' +
          (novo ? ' placeholder="SHK-03" required' : ' readonly') + '></div>' +
        '<div class="campo"><label>Nome</label><input name="nome" value="' + e(equipamento.nome) + '" required></div>' +
        '<div class="campo"><label>Grupo</label>' +
          '<input name="grupo" list="grupos-existentes" autocomplete="off" value="' + e(equipamento.grupo || '') + '" ' +
          'placeholder="Ex.: Burner">' +
          '<datalist id="grupos-existentes">' +
            gruposExistentes.map(function (g) { return '<option value="' + e(g) + '"></option>'; }).join('') +
          '</datalist></div>' +
        '<div class="campo"><label>Posições em paralelo</label><input type="number" min="1" name="posicoes" value="' + e(String(equipamento.posicoes)) + '"></div>' +
        '<div class="campo"><label>Horas por dia</label><input type="number" min="1" max="24" name="horasDia" value="' + e(String(equipamento.horasDia)) + '"></div>' +
      '</div>' +
      '<div class="campo"><label style="display:flex;align-items:center;gap:7px;color:var(--texto)">' +
        '<input type="checkbox" name="continuo" style="width:auto"' + (equipamento.continuo ? ' checked' : '') + '>' +
        'Ensaio corre 24 h/dia sem operador (câmaras e bancos automáticos)</label></div>' +
      '<p class="sub" style="margin:0 0 12px">Unidades com o mesmo grupo são intercambiáveis: o ' +
        'procedimento pede o grupo e o planejamento escolhe a que libera mais cedo. Deixe em branco ' +
        'para a unidade formar um grupo só dela.</p>' +
      '<div class="campo"><label>Dias de operação</label><div>' +
        SEMANA.map(function (d) {
          return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-weight:500;color:var(--texto)">' +
            '<input type="checkbox" name="diasUteis" data-grupo="1" value="' + d.valor + '" style="width:auto"' +
            (equipamento.diasUteis.indexOf(d.valor) !== -1 ? ' checked' : '') + '>' + d.nome + '</label>';
        }).join('') +
      '</div></div>';

    ui.modal({
      titulo: novo ? 'Novo equipamento' : 'Editar ' + equipamento.nome,
      corpo: corpo,
      confirmar: 'Salvar equipamento',
      aoConfirmar: function (v) {
        if (!v.id || !v.nome) { ui.notificar('Informe código e nome.'); return false; }
        var dias = (v.diasUteis || []).map(Number);
        if (!dias.length) { ui.notificar('Selecione ao menos um dia de operação.'); return false; }
        TC.store.salvarEquipamento({
          id: v.id, nome: v.nome, grupo: v.grupo.trim(), posicoes: Number(v.posicoes) || 1,
          continuo: !!v.continuo, horasDia: Number(v.horasDia) || 8,
          diasUteis: dias, manutencao: equipamento.manutencao || []
        });
        ui.notificar('Equipamento salvo — planejamento recalculado.');
      }
    });
  }

  function nomeTipo(id) {
    var t = util.porId(TC.data.TIPOS_MANUTENCAO, id);
    return t ? t.nome : (id || '—');
  }

  /* Registro do que foi feito: fecha uma parada planejada. As datas podem mudar aqui —
     manutenção raramente termina no dia previsto. */
  function abrirRegistro(equipamento, parada) {
    ui.modal({
      titulo: 'Registrar manutenção de ' + equipamento.nome,
      corpo:
        '<div class="aviso">Parada planejada de <strong>' +
          e(util.formatarData(parada.inicio, true)) + '</strong> a <strong>' +
          e(util.formatarData(parada.fim, true)) + '</strong> — ' + e(parada.motivo) + '.<br>' +
          'Ajuste as datas se a execução saiu do previsto.</div>' +
        '<div class="grade-campos">' +
          '<div class="campo"><label>Início realizado</label>' +
            '<input type="date" name="inicio" value="' + e(parada.inicio) + '"></div>' +
          '<div class="campo"><label>Fim realizado</label>' +
            '<input type="date" name="fim" value="' + e(parada.fim) + '"></div>' +
          '<div class="campo"><label>Tipo</label><select name="tipo">' +
            ui.opcoes(TC.data.TIPOS_MANUTENCAO, parada.tipo || 'PREVENTIVA') + '</select></div>' +
          '<div class="campo"><label>Responsável</label>' +
            '<input name="responsavel" value="' + e(parada.responsavel || '') + '" ' +
            'placeholder="Quem executou"></div>' +
        '</div>' +
        '<div class="campo"><label>O que foi feito</label>' +
          '<textarea name="oQueFoiFeito" rows="3" placeholder="Troca de termopares, calibração da célula de carga, ajuste do controlador...">' +
          e(parada.oQueFoiFeito || '') + '</textarea></div>',
      confirmar: 'Registrar como realizada',
      aoConfirmar: function (v) {
        if (!v.inicio || !v.fim) { ui.notificar('Informe início e fim.'); return false; }
        if (util.diffDias(v.inicio, v.fim) < 0) { ui.notificar('O fim deve ser posterior ao início.'); return false; }
        if (!(v.oQueFoiFeito || '').trim()) {
          ui.notificar('Descreva o que foi feito — é o histórico da bancada.');
          return false;
        }
        TC.store.registrarManutencao(equipamento.id, parada.id, v);
        ui.notificar('Manutenção registrada.');
      }
    });
  }

  function abrirManutencao(equipamento, hoje) {
    var situacao = TC.manutencao.situacao(equipamento, hoje);
    var lista = TC.manutencao.paradas(equipamento).slice().sort(function (a, b) {
      return util.diffDias(b.inicio, a.inicio);
    });

    var corpo =
      '<div class="aviso">' +
        (situacao.ultima
          ? '<strong>Última manutenção:</strong> ' + e(util.formatarData(situacao.ultima.fim, true)) +
            ' (' + situacao.diasDesdeUltima + ' dias atrás) — ' + e(situacao.ultima.oQueFoiFeito || situacao.ultima.motivo)
          : '<strong>Nenhuma manutenção registrada</strong> nesta bancada') +
        '<br>' +
        (situacao.proxima
          ? '<strong>Próxima prevista:</strong> ' + e(util.formatarData(situacao.proxima.inicio, true)) +
            ' (em ' + situacao.diasParaProxima + ' dias) — ' + e(situacao.proxima.motivo)
          : '<strong>Sem próxima manutenção agendada.</strong>') +
      '</div>' +
      (situacao.atrasadas.length
        ? '<div class="aviso erro">' + situacao.atrasadas.length +
          ' parada(s) com data vencida e sem registro do que foi feito. Registre ou remova.</div>'
        : '') +
      '<p class="sub" style="margin:0 0 10px">Agendar uma parada bloqueia a agenda: nenhum ensaio ' +
        'é planejado atravessando o período, e as demandas já planejadas são empurradas.</p>' +
      '<div class="grade-campos">' +
        '<div class="campo"><label>Início</label><input type="date" name="inicio" value="' +
          e(util.hoje()) + '"></div>' +
        '<div class="campo"><label>Fim</label><input type="date" name="fim" value="' +
          e(util.somaDias(util.hoje(), 3)) + '"></div>' +
        '<div class="campo"><label>Tipo</label><select name="tipo">' +
          ui.opcoes(TC.data.TIPOS_MANUTENCAO, 'PREVENTIVA') + '</select></div>' +
        '<div class="campo"><label>Motivo / escopo previsto</label>' +
          '<input name="motivo" placeholder="Calibração anual"></div>' +
      '</div>' +
      (lista.length
        ? '<div class="tabela-rolagem" style="margin-top:8px"><table><thead><tr>' +
          '<th>Período</th><th>Tipo</th><th>Escopo / o que foi feito</th><th>Situação</th><th></th>' +
          '</tr></thead><tbody>' +
          lista.map(function (m) {
            var realizada = m.situacao === TC.manutencao.REALIZADA;
            /* diffDias(a, b) é b - a: vencida é a planejada cujo fim ficou para trás. */
            var vencida = !realizada && util.diffDias(m.fim, hoje) > 0;
            return '<tr>' +
              '<td style="white-space:nowrap">' + e(util.formatarData(m.inicio, true)) + ' → ' +
                e(util.formatarData(m.fim, true)) + '</td>' +
              '<td>' + e(nomeTipo(m.tipo)) + '</td>' +
              '<td><div>' + e(m.motivo) + '</div>' +
                (m.oQueFoiFeito ? '<div class="sub">' + e(m.oQueFoiFeito) + '</div>' : '') +
                (m.responsavel ? '<div class="sub">por ' + e(m.responsavel) + '</div>' : '') + '</td>' +
              '<td><span class="etiqueta ' + (realizada ? 'ok' : vencida ? 'erro' : 'alerta') + '">' +
                (realizada ? 'Realizada' : vencida ? 'Vencida' : 'Planejada') + '</span></td>' +
              '<td class="num" style="white-space:nowrap">' +
                (realizada ? '' : '<button type="button" class="botao pequeno primario registrar" data-janela="' +
                  e(m.id) + '">Registrar</button> ') +
                '<button type="button" class="botao pequeno perigo remover" data-janela="' +
                  e(m.id) + '">✕</button></td>' +
            '</tr>';
          }).join('') + '</tbody></table></div>'
        : '');

    var janela = ui.modal({
      titulo: 'Manutenção de ' + equipamento.nome,
      corpo: corpo,
      largura: 'min(900px, 100%)',
      confirmar: 'Agendar parada',
      aoConfirmar: function (v) {
        if (!v.inicio || !v.fim) { ui.notificar('Informe início e fim.'); return false; }
        if (util.diffDias(v.inicio, v.fim) < 0) { ui.notificar('O fim deve ser posterior ao início.'); return false; }
        TC.store.adicionarManutencao(equipamento.id, {
          inicio: v.inicio, fim: v.fim, tipo: v.tipo, motivo: v.motivo || 'Manutenção'
        });
        ui.notificar('Parada agendada — planejamento recalculado.');
      }
    });

    janela.querySelectorAll('.registrar').forEach(function (botao) {
      botao.onclick = function () {
        var parada = util.porId(equipamento.manutencao, botao.dataset.janela);
        ui.fecharModal();
        abrirRegistro(equipamento, parada);
      };
    });
    janela.querySelectorAll('.remover').forEach(function (botao) {
      botao.onclick = function () {
        TC.store.removerManutencao(equipamento.id, botao.dataset.janela);
        ui.fecharModal();
        ui.notificar('Parada removida.');
      };
    });
  }

  function render(container, ctx) {
    var estado = ctx.estado;
    var podeEditar = ctx.podeEditar;
    var horizonte = 90;
    var ocupacao = ocupacaoPorEquipamento(ctx.plano, ctx.hoje, horizonte);

    var pendencias = TC.manutencao.pendencias(estado, ctx.hoje);
    var vencidas = pendencias.filter(function (p) { return p.tipo === 'atrasada'; });
    var semPlano = pendencias.filter(function (p) { return p.tipo === 'sem-proxima'; });

    var irmaos = {};
    TC.scheduler.agruparEquipamentos(estado.equipamentos).forEach(function (g) {
      irmaos[g.id] = g.membros.length;
    });

    var linhas = estado.equipamentos.map(function (eq) {
      var o = ocupacao[eq.id] || { dias: 0, ensaios: 0, horas: 0, custo: 0 };
      var m = TC.manutencao.situacao(eq, ctx.hoje);
      var capacidade = eq.posicoes * horizonte;
      var uso = Math.min(100, Math.round(o.dias / capacidade * 100));
      var dias = eq.diasUteis.slice().sort().map(function (d) { return util.NOMES_DIA[d]; }).join(' ');
      return '<tr data-equip="' + e(eq.id) + '">' +
        '<td><div class="forte">' + e(eq.nome) + '</div>' +
          '<div class="sub mono">' + e(eq.id) + '</div></td>' +
        '<td>' + (irmaos[TC.scheduler.grupoDe(eq)] > 1
          ? '<span class="etiqueta marca">' + e(TC.scheduler.grupoDe(eq)) + '</span>' +
            '<div class="sub">' + irmaos[TC.scheduler.grupoDe(eq)] + ' unidades</div>'
          : '<span class="sub">unidade única</span>') + '</td>' +
        '<td class="num">' + eq.posicoes + '</td>' +
        '<td>' + (eq.continuo ? '<span class="etiqueta ok">24 h contínuo</span>' : '<span class="etiqueta">' + eq.horasDia + ' h/dia</span>') +
          '<div class="sub">' + e(dias) + '</div></td>' +
        '<td class="num">' + o.ensaios + '</td>' +
        '<td style="min-width:150px">' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<span class="barra-trilho" style="flex:1"><span class="barra-valor' +
              (uso > 85 ? ' erro' : uso > 60 ? ' alerta' : '') + '" style="width:' + uso + '%"></span></span>' +
            '<span class="sub">' + uso + '%</span></div>' +
        '</td>' +
        '<td class="num">' + Math.round(o.horas) + ' h</td>' +
        /* Última e próxima manutenção são a pergunta de gestão da bancada: há quanto
           tempo ela roda sem intervenção e quando ela para de novo. */
        '<td>' + (m.ultima
          ? '<div class="forte">' + e(util.formatarData(m.ultima.fim, true)) + '</div>' +
            '<div class="sub">' + e(nomeTipo(m.ultima.tipo)) + ' · há ' + m.diasDesdeUltima + ' d</div>' +
            '<div class="sub">' + e(util.recortar(m.ultima.oQueFoiFeito || m.ultima.motivo, 46)) + '</div>'
          : '<span class="sub">nenhuma registrada</span>') + '</td>' +
        '<td>' + (m.proxima
          ? '<div class="forte">' + e(util.formatarData(m.proxima.inicio, true)) + '</div>' +
            '<div class="sub">' + e(nomeTipo(m.proxima.tipo)) + ' · em ' + m.diasParaProxima + ' d</div>'
          : '<span class="etiqueta alerta">não agendada</span>') +
          (m.atrasadas.length
            ? '<div><span class="etiqueta erro">' + m.atrasadas.length + ' vencida(s)</span></div>'
            : '') +
          (m.emManutencaoHoje ? '<div><span class="etiqueta erro">parada hoje</span></div>' : '') +
        '</td>' +
        '<td class="num" style="white-space:nowrap">' +
          (podeEditar
            ? '<button class="botao pequeno manutencao">Manutenção</button> ' +
              '<button class="botao pequeno editar">Editar</button> ' +
              '<button class="botao pequeno perigo excluir" title="Remover equipamento">✕</button>'
            : '<span class="sub">—</span>') +
        '</td>' +
      '</tr>';
    }).join('');

    container.innerHTML =
      '<div class="cabecalho">' +
        '<div><h2>Equipamentos</h2>' +
        '<p>Capacidade instalada do laboratório. Posições em paralelo, calendário e paradas de manutenção são exatamente as restrições que o planejamento respeita. O custo do ensaio não vem daqui: ele sai do hourly rate do procedimento.</p></div>' +
        (ctx.podeEditar ? '<div class="acoes"><button class="botao primario" id="novo">+ Novo equipamento</button></div>' : '') +
      '</div>' +
      /* Vencidas aparecem uma a uma: cada uma é uma cobrança. "Sem próxima agendada" vira
         uma linha só, senão o aviso vira uma parede que ninguém lê. */
      (vencidas.length || semPlano.length
        ? '<div class="cartao"><div class="cartao-corpo">' +
          vencidas.slice(0, 6).map(function (p) {
            return '<div class="aviso erro" style="margin-bottom:8px">' + e(p.texto) + '</div>';
          }).join('') +
          (vencidas.length > 6
            ? '<div class="sub" style="margin-bottom:8px">+ ' + (vencidas.length - 6) +
              ' outra(s) parada(s) vencida(s).</div>'
            : '') +
          (semPlano.length
            ? '<div class="aviso alerta" style="margin:0"><strong>' + semPlano.length +
              ' equipamento(s) sem próxima manutenção agendada:</strong> ' +
              e(semPlano.map(function (p) { return p.equipamento.nome; }).join(', ')) + '.</div>'
            : '') +
          '</div></div>'
        : '') +
      '<div class="cartao">' +
        '<div class="cartao-topo"><h3>Ocupação nos próximos ' + horizonte + ' dias</h3>' +
          '<span class="sub">Percentual calculado sobre posições × dias disponíveis</span></div>' +
        '<div class="tabela-rolagem"><table><thead><tr>' +
          '<th>Equipamento</th><th>Grupo</th><th class="num">Posições</th><th>Regime</th>' +
          '<th class="num">Ensaios</th><th>Ocupação</th><th class="num">Horas alocadas</th>' +
          '<th>Última manutenção</th><th>Próxima prevista</th><th></th>' +
        '</tr></thead><tbody>' + linhas + '</tbody></table></div>' +
      '</div>';

    var botaoNovo = container.querySelector('#novo');
    if (botaoNovo) botaoNovo.onclick = function () { abrirEdicao(null, estado); };
    container.querySelectorAll('tr[data-equip]').forEach(function (tr) {
      var eq = util.porId(estado.equipamentos, tr.dataset.equip);
      var editar = tr.querySelector('.editar');
      if (!editar) return;
      editar.onclick = function () { abrirEdicao(eq, estado); };
      tr.querySelector('.manutencao').onclick = function () { abrirManutencao(eq, ctx.hoje); };
      tr.querySelector('.excluir').onclick = function () {
        var grupo = TC.scheduler.grupoDe(eq);
        var ultimaDoGrupo = irmaos[grupo] === 1;
        var dependentes = ultimaDoGrupo
          ? estado.testes.filter(function (t) { return TC.scheduler.gruposDoTeste(t).indexOf(grupo) !== -1; })
          : [];
        ui.confirmarAcao(
          'Remover ' + eq.nome + '?' +
          (dependentes.length
            ? ' É a última unidade do grupo ' + grupo + ', e ' + dependentes.length +
              ' procedimento(s) o usam: eles ficarão sem bancada até serem apontados para outro grupo.'
            : ultimaDoGrupo ? '' : ' O grupo ' + grupo + ' continua com as outras unidades.'),
          function () {
            TC.store.removerEquipamento(eq.id);
            ui.notificar('Equipamento removido.');
          });
      };
    });
  }

  TC.views = TC.views || {};
  TC.views.equipamentos = { render: render };
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
  <script>
/* Peças e amostras: os tipos de peça que o laboratório ensaia.
   Não pertencem a um cliente nem a uma área — qualquer cliente pode ter amostra de qualquer
   tipo. A data de chegada das amostras é informada em cada demanda, não aqui. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  function abrirEdicao(peca) {
    var novo = !peca;
    peca = peca || { id: '', nome: '', descricao: '', custoAmostra: 0 };

    var corpo =
      '<div class="grade-campos">' +
        '<div class="campo"><label>Tipo de peça</label>' +
          '<input name="nome" value="' + e(peca.nome) + '" required placeholder="Ex.: Hot End"></div>' +
        '<div class="campo"><label>Custo por amostra (R$)</label>' +
          '<input type="number" min="0" step="10" name="custoAmostra" value="' + e(String(peca.custoAmostra || 0)) + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Descrição</label>' +
        '<textarea name="descricao" rows="2" placeholder="O que entra neste tipo de peça">' + e(peca.descricao || '') + '</textarea></div>' +
      (novo ? '' : '<p class="sub" style="margin-bottom:0">Código <span class="mono">' + e(peca.id) + '</span> — ' +
        'referenciado pelas demandas, não muda.</p>');

    ui.modal({
      titulo: novo ? 'Novo tipo de peça' : 'Editar ' + peca.nome,
      corpo: corpo,
      confirmar: 'Salvar peça',
      aoConfirmar: function (v) {
        if (!v.nome.trim()) { ui.notificar('Informe o tipo de peça.'); return false; }
        TC.store.salvarPeca({
          id: peca.id || undefined, nome: v.nome.trim(), descricao: v.descricao.trim(),
          custoAmostra: Number(v.custoAmostra) || 0
        });
        ui.notificar('Peça salva.');
      }
    });
  }

  function render(container, ctx) {
    var estado = ctx.estado;
    var podeEditar = ctx.podeEditar;

    var uso = {};
    estado.pecas.forEach(function (p) {
      uso[p.id] = { ensaios: 0, amostras: 0, custo: 0, proximaChegada: null, clientes: {} };
    });
    ctx.plano.alocacoes.forEach(function (a) {
      var u = a.peca && uso[a.peca.id];
      if (!u) return;
      u.ensaios++;
      u.amostras += a.demanda.quantidade;
      u.custo += a.custo.total;
      u.clientes[a.demanda.clienteId] = true;
      var chegada = a.demanda.dataAmostras;
      if (chegada && (!u.proximaChegada || util.diffDias(chegada, u.proximaChegada) > 0)) {
        u.proximaChegada = chegada;
      }
    });

    var linhas = estado.pecas.map(function (p) {
      var u = uso[p.id];
      var qtdClientes = Object.keys(u.clientes).length;
      return '<tr data-peca="' + e(p.id) + '">' +
        '<td><div class="forte">' + e(p.nome) + '</div>' +
          '<div class="sub">' + e(p.descricao || '') + '</div></td>' +
        '<td class="num">' + e(util.formatarMoeda(p.custoAmostra)) + '</td>' +
        '<td class="num">' + u.ensaios + '</td>' +
        '<td class="num">' + u.amostras + '</td>' +
        '<td class="num">' + (qtdClientes || '<span class="sub">—</span>') + '</td>' +
        '<td>' + (u.proximaChegada
          ? e(util.formatarData(u.proximaChegada, true))
          : '<span class="sub">—</span>') + '</td>' +
        '<td class="num forte">' + e(util.formatarMoeda(u.custo)) + '</td>' +
        '<td class="num" style="white-space:nowrap">' +
          (podeEditar
            ? '<button class="botao pequeno editar">Editar</button> ' +
              '<button class="botao pequeno perigo excluir">✕</button>'
            : '<span class="sub">—</span>') + '</td>' +
      '</tr>';

    if (registroId) {
      var doRegistro = docs.filter(function (d) { return d.refId === registroId; });

  /* ---- Lançamento em lote ---- */

  /* O caminho para tirar as datas da planilha e pôr na plataforma sem digitar 229 vezes.
     Nada é gravado antes da conferência: o que vai entrar e o que foi recusado aparecem
     lado a lado enquanto se cola. */
  function abrirLote(instrumentos) {
    var corpo =
      '<div class="aviso">Cole aqui o recorte da planilha: <strong>uma linha por ' +
        'instrumento</strong>, com o código na primeira coluna e a data da última ' +

        'e na quarta.' +
        '<div class="sub" style="margin-top:6px">Datas em 31/12/2025 ou 2025-12-31. ' +
        'O código antigo também é reconhecido. A validade sai da data lançada mais a ' +
        'periodicidade do instrumento (12 meses, salvo se você já mudou).</div></div>' +
      '<div class="campo"><label>Código e data</label>' +

        'Menlo,Consolas,monospace;font-size:12.5px" placeholder="TCL-AC-012&#9;12/03/2026&#10;' +

      '<div id="previa-lote"></div>';

    var janela = ui.modal({
      titulo: 'Lançar calibrações em lote',
      corpo: corpo,
      largura: 'min(820px, 100%)',
      confirmar: 'Lançar calibrações',
      aoConfirmar: function (v) {
        var leitura = cal().interpretarLote(v.lote, instrumentos);
        if (!leitura.aplicaveis.length) {
          ui.notificar('Nenhuma linha válida para lançar.');
          return false;
        }
        var resultado = TC.store.lancarCalibracoesEmLote(leitura.aplicaveis.map(function (l) {
          return {
            instrumentoId: l.instrumento.id, data: l.data,
            certificado: l.certificado, laboratorio: l.laboratorio
          };
        }));
        ui.notificar(resultado.aplicados.length + ' calibração(ões) lançada(s)' +
          (leitura.problemas.length ? ' · ' + leitura.problemas.length + ' linha(s) ignorada(s).' : '.'));
      }
    });

    var previa = janela.querySelector('#previa-lote');
    var campo = janela.querySelector('[name=lote]');
    var botao = janela.querySelector('.confirmar');

    function conferir() {
      var leitura = cal().interpretarLote(campo.value, instrumentos);
      botao.disabled = leitura.aplicaveis.length === 0;
      if (!leitura.linhas.length) { previa.innerHTML = ''; return; }

      previa.innerHTML =
        '<div class="aviso' + (leitura.aplicaveis.length ? '' : ' alerta') + '">' +
          '<strong>' + leitura.aplicaveis.length + '</strong> linha(s) prontas para lançar' +
          (leitura.problemas.length
            ? ' · <strong>' + leitura.problemas.length + '</strong> com problema'
            : '') + '.</div>' +
        (leitura.problemas.length
          ? '<div class="lista-selecao" style="max-height:170px">' +
            leitura.problemas.slice(0, 40).map(function (l) {
              return '<div class="linha-selecao">' +
                '<span class="sub mono">linha ' + l.linha + '</span>' +
                '<span class="mono forte">' + e(l.codigo || '—') + '</span>' +
                '<span class="etiqueta erro">' + e(cal().MOTIVOS_DO_LOTE[l.situacao]) + '</span>' +
                '</div>';
            }).join('') +
            (leitura.problemas.length > 40
              ? '<div class="linha-selecao sub">e mais ' + (leitura.problemas.length - 40) + '.</div>'
              : '') +
            '</div>'
          : '') +
        (leitura.aplicaveis.length
          ? '<div class="campo" style="margin-top:12px"><label>Prévia das validades</label>' +
            '<div class="lista-selecao" style="max-height:200px">' +
            leitura.aplicaveis.slice(0, 40).map(function (l) {
              var vence = cal().somaMeses(l.data, l.instrumento.periodicidadeMeses || 12);
              return '<div class="linha-selecao">' +
                '<span class="mono forte">' + e(l.instrumento.id) + '</span>' +
                '<span class="sub" style="flex:1">' + e(util.recortar(l.instrumento.nome, 40)) + '</span>' +
                '<span class="sub">' + e(util.formatarData(l.data, true)) + '</span>' +
                '<span class="etiqueta ok">até ' + e(util.formatarData(vence, true)) + '</span>' +
                '</div>';
            }).join('') +
            (leitura.aplicaveis.length > 40
              ? '<div class="linha-selecao sub">e mais ' + (leitura.aplicaveis.length - 40) + '.</div>'
              : '') +
            '</div></div>'
          : '');
    }

    campo.addEventListener('input', conferir);
    campo.addEventListener('change', conferir);
    botao.disabled = true;
    campo.focus();
  }

      '<div class="indicadores">' +
        '<div class="indicador"><div class="rotulo">Instrumentos</div><div class="valor">' +
          resumo.total + '</div><div class="nota">' + resumo.emUso + ' em uso · ' +

  /* O CSV sai com o que está filtrado na tela: é assim que se manda a lista de um posto

  <script>
/* Painel: os indicadores de gestão do centro de testes.
   Volume do mês, ocupação de cada bancada contra a capacidade dela, qualidade do relatório

(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
    'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function nomeDoMes(mes) {
    return MESES[Number(mes.slice(5, 7)) - 1] + ' de ' + mes.slice(0, 4);
  }

  function porcento(fracao) {
    return Math.round((fracao || 0) * 100) + '%';
  }

  /* Ocupação passa de 100% quando o planejamento reservou mais horas do que a bancada tem
     no mês — sinal de gargalo, não de erro de conta. */
  function corDaOcupacao(ocupacao) {
    if (ocupacao > 1) return 'erro';
    if (ocupacao >= 0.85) return 'alerta';
    return '';
  }

  function tabelaDeCusto(grupos, rotulo, vazio) {
    if (!grupos.length) return ui.vazio(vazio[0], vazio[1]);
    var maximo = grupos[0].custo || 1;
    var total = grupos.reduce(function (s, g) { return s + g.custo; }, 0);
    return '<table><thead><tr><th>' + e(rotulo) + '</th><th class="num">Ensaios</th>' +
      '<th class="num">Horas</th><th style="width:38%">Custo</th></tr></thead><tbody>' +
      grupos.map(function (g) {
        return '<tr><td class="forte">' + e(g.chave) + '</td>' +
          '<td class="num">' + g.ensaios + '</td>' +
          '<td class="num">' + Math.round(g.horas) + ' h</td>' +
          '<td><div style="display:flex;align-items:center;gap:9px">' +
            '<span class="barra-trilho" style="flex:1"><span class="barra-valor" style="width:' +
              Math.round(g.custo / maximo * 100) + '%"></span></span>' +
            '<span class="forte" style="min-width:96px;text-align:right">' +
              e(util.formatarMoeda(g.custo)) + '</span>' +
          '</div></td></tr>';
      }).join('') +
      '</tbody><tfoot><tr><td class="forte">Total</td>' +
        '<td class="num forte">' + grupos.reduce(function (s, g) { return s + g.ensaios; }, 0) + '</td>' +
        '<td class="num forte">' + Math.round(grupos.reduce(function (s, g) { return s + g.horas; }, 0)) + ' h</td>' +
        '<td class="num forte">' + e(util.formatarMoeda(total)) + '</td></tr></tfoot></table>';
  }

  function render(container, ctx) {
    var estado = ctx.estado, hoje = ctx.hoje, plano = ctx.plano;
    var kpi = TC.kpi;

    var meses = kpi.mesesComMovimento(estado, plano, hoje);
    var mes = ctx.filtros.mesPainel && meses.indexOf(ctx.filtros.mesPainel) !== -1
      ? ctx.filtros.mesPainel : kpi.mesDe(hoje);
    var ano = kpi.anoDe(mes);

    var realizados = kpi.realizadosNoMes(estado, plano, mes);
    var ftt = kpi.certoDaPrimeiraVez(estado, plano, mes);
    var ocupacao = kpi.ocupacaoNoMes(estado, plano, mes);
    var noAno = kpi.custoPlanejadoNoAno(plano, ano);
    var porProjeto = kpi.custoPorProjeto(estado, plano);
    var porCliente = kpi.custoPorCliente(estado, plano);

    var horasMes = ocupacao.reduce(function (s, o) { return s + o.horasPlanejadas; }, 0);
    var capacidadeMes = ocupacao.reduce(function (s, o) { return s + o.capacidade; }, 0);

    var custoRealizado = realizados.reduce(function (s, a) { return s + a.custo.total; }, 0);
    var semData = kpi.concluidasSemData(estado);

    /* Riscos continuam no painel: são o que exige decisão nesta semana. */

      else if (!a.cotacao && !a.inicio && TC.scheduler.STATUS_ATIVOS.indexOf(a.demanda.status) !== -1) semJanela++;
    });

    var indicadores =
      '<div class="indicadores">' +
        '<div class="indicador"><div class="rotulo">Testes realizados</div><div class="valor">' +

        '<td><div class="forte">' + e(o.equipamento.nome) + '</div>' +

        '<td class="num">' + o.ensaios + '</td>' +
        '<td class="num">' + Math.round(o.horasPlanejadas) + ' h</td>' +
        '<td class="num">' + Math.round(o.capacidade) + ' h</td>' +
        '<td><div style="display:flex;align-items:center;gap:9px">' +
          '<span class="barra-trilho" style="flex:1"><span class="barra-valor ' +
            corDaOcupacao(o.ocupacao) + '" style="width:' + largura + '%"></span></span>' +
          '<span class="forte" style="min-width:52px;text-align:right">' +
            porcento(o.ocupacao) + '</span>' +
        '</div></td></tr>';
    }).join('');

    container.innerHTML =
      '<div class="cabecalho">' +
        '<div><h2>Painel do centro de testes</h2>' +
        '<p>Volume e ocupação do mês, qualidade do relatório entregue ao cliente e para onde vai ' +
        'o custo. As horas do mês vêm do planejamento; a conclusão e a validação do relatório ' +
        'são registradas em cada demanda.</p></div>' +
        '<div class="acoes"><div class="campo" style="margin:0;min-width:190px">' +
          '<label for="f-mes">Mês de referência</label><select id="f-mes">' +
          meses.map(function (m) {
            return '<option value="' + e(m) + '"' + (m === mes ? ' selected' : '') + '>' +
              e(nomeDoMes(m)) + '</option>';
          }).join('') +
        '</select></div></div>' +
      '</div>' +
      indicadores +

      /* Sem data de conclusão o ensaio não pode ser atribuído a mês nenhum. Em vez de

      (semData.length
        ? '<div class="cartao"><div class="cartao-corpo"><div class="aviso alerta" style="margin:0">' +
          '<strong>' + semData.length + ' teste(s) marcados como concluídos sem data de conclusão.</strong> ' +
          'Eles não entram em nenhum mês do painel até a data ser informada na demanda: ' +
          e(semData.slice(0, 6).map(function (d) { return d.lti || d.id; }).join(', ')) +
          (semData.length > 6 ? ' e mais ' + (semData.length - 6) + '.' : '.') +
          '</div></div></div>'

        '<div class="cartao-topo"><h3>Ocupação por equipamento — ' + e(nomeDoMes(mes)) + '</h3>' +

        (linhasOcupacao
          ? '<div class="tabela-rolagem"><table><thead><tr><th>Equipamento</th>' +
            '<th class="num">Ensaios</th><th class="num">Planejadas</th>' +
            '<th class="num">Disponíveis</th><th style="width:34%">Ocupação</th>' +
            '</tr></thead><tbody>' + linhasOcupacao + '</tbody></table></div>'
          : ui.vazio('Nenhum equipamento cadastrado', 'Cadastre as bancadas para medir a ocupação.')) +
      '</div>' +

      '<div class="cartao"><div class="cartao-topo"><h3>Custo por projeto</h3>' +
        '<span class="sub">tudo que está confirmado, cotações à parte</span></div>' +
        '<div class="tabela-rolagem">' +
        tabelaDeCusto(porProjeto, 'Projeto',
          ['Sem custo por projeto', 'Confirme testes no catálogo para alimentar o painel.']) +
        '</div></div>' +

      '<div class="cartao"><div class="cartao-topo"><h3>Custo por cliente</h3></div>' +
        '<div class="tabela-rolagem">' +
        tabelaDeCusto(porCliente, 'Cliente',
          ['Sem custo por cliente', 'Confirme testes no catálogo para alimentar o painel.']) +
        '</div></div>' +

      '<div class="cartao"><div class="cartao-topo"><h3>Testes concluídos em ' + e(nomeDoMes(mes)) + '</h3>' +
        '<span class="sub">com a situação do relatório</span></div>' +
        (realizados.length
          ? '<div class="tabela-rolagem"><table><thead><tr><th>Conclusão</th><th>Procedimento</th>' +
            '<th>Projeto</th><th>Cliente</th><th>LTI</th><th>Relatório</th>' +
            '<th class="num">Custo</th></tr></thead><tbody>' +
            realizados.map(function (a) {
              var d = a.demanda;
              var cliente = util.porId(estado.clientes, d.clienteId);
              var correcoes = Number(d.relatorioCorrecoes) || 0;
              return '<tr><td class="forte">' +
                e(util.formatarData(TC.kpi.dataDeConclusao(a), true)) + '</td>' +
                '<td>' + e(a.teste ? a.teste.nome : d.testeId) + '</td>' +
                '<td>' + e(d.projeto || '—') + '</td>' +
                '<td>' + e(cliente ? cliente.nome : d.clienteId) + '</td>' +
                '<td>' + ui.celulaLti(d) + '</td>' +
                '<td>' + ui.etiquetaEstado('demanda', d.status) +
                  (correcoes ? ' <span class="sub">' + correcoes + ' correção(ões)</span>' : '') + '</td>' +
                '<td class="num">' + e(util.formatarMoeda(a.custo.total)) + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : ui.vazio('Nenhum teste concluído em ' + nomeDoMes(mes),
              'Marque a demanda como concluída e informe a data para o indicador contar.')) +
      '</div>';

    var seletor = container.querySelector('#f-mes');
    seletor.addEventListener('change', function () {
      ctx.filtros.mesPainel = seletor.value;
      ctx.atualizar();
    });
  }

  TC.views = TC.views || {};
  TC.views.painel = { render: render };
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
  <script>
/* Matriz de permissões: quem vê e quem edita cada janela. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  function render(container, ctx) {
    var estado = ctx.estado;
    var podeEditar = TC.permissoes.podeEditar(estado, 'permissoes');
    var perfis = TC.data.PERFIS;

    var rotas = TC.app.ROTAS.filter(function (r) { return estado.permissoes[r.id]; });

    var linhas = rotas.map(function (rota) {
      var regra = estado.permissoes[rota.id];
      return '<tr data-rota="' + e(rota.id) + '">' +
        '<td><div class="forte">' + rota.icone + ' ' + e(rota.nome) + '</div>' +
          '<div class="sub">' + e(rota.grupo) + '</div></td>' +
        perfis.map(function (perfil) {
          function caixa(acao) {
            var marcado = regra[acao].indexOf(perfil.id) !== -1;
            return '<label style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;' +
              'font-weight:500;color:var(--texto)">' +
              '<input type="checkbox" style="width:auto" data-acao="' + acao + '" ' +
                'data-perfil="' + e(perfil.id) + '"' + (marcado ? ' checked' : '') +
                (podeEditar ? '' : ' disabled') + '>' + acao + '</label>';
          }
          return '<td>' + caixa('ver') + caixa('editar') + '</td>';
        }).join('') +
      '</tr>';
    }).join('');

    container.innerHTML =
      '<div class="cabecalho">' +
        '<div><h2>Perfis e permissões</h2>' +
        '<p>O que cada perfil enxerga e o que pode alterar em cada janela. Marcar <strong>editar</strong> liga <strong>ver</strong> junto, porque não dá para alterar uma tela que não se vê.</p></div>' +
        (podeEditar ? '<div class="acoes"><button class="botao" id="restaurar">Restaurar padrão</button></div>' : '') +
      '</div>' +
      '<div class="aviso alerta">Sem servidor, o perfil é uma escolha da interface: ele organiza o ' +
        'trabalho e evita edição acidental, mas não é controle de acesso — quem abrir o backup JSON ' +
        'alcança tudo. Autenticação de verdade só com um back-end.</div>' +
      '<div class="cartao">' +
        '<div class="cartao-topo"><h3>Matriz de permissões</h3></div>' +
        '<div class="tabela-rolagem"><table><thead><tr><th>Janela</th>' +
          perfis.map(function (p) {
            return '<th>' + e(p.nome) + '<div class="sub" style="font-weight:400;text-transform:none">' +
              e(p.descricao) + '</div></th>';
          }).join('') +
        '</tr></thead><tbody>' + linhas + '</tbody></table></div>' +
      '</div>';

    if (!podeEditar) return;

    container.querySelector('#restaurar').onclick = function () {
      ui.confirmarAcao('Voltar a matriz de permissões ao padrão?', function () {
        TC.store.restaurarPermissoes();
        ui.notificar('Permissões restauradas.');
      });
    };

    container.querySelectorAll('tr[data-rota]').forEach(function (tr) {
      tr.querySelectorAll('input[type=checkbox]').forEach(function (caixa) {
        caixa.onchange = function () {
          TC.store.definirPermissao(tr.dataset.rota, caixa.dataset.acao, caixa.dataset.perfil, caixa.checked);
        };
      });
    });
  }

  TC.views = TC.views || {};
  TC.views.permissoes = { render: render };
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
  <script>
/* Montagem da aplicação: navegação, recálculo do planejamento e backup dos dados. */
(function (global) {
  'use strict';

  var TC = (global.TC = global.TC || {});
  var util = TC.util, ui = TC.ui, e = util.escapar;

  var ROTAS = [
    { id: 'catalogo', nome: 'Catálogo de testes', icone: '📋', grupo: 'Validação' },
    { id: 'cotacoes', nome: 'Cotações', icone: '💰', grupo: 'Validação' },
    { id: 'demandas', nome: 'Demandas', icone: '✅', grupo: 'Validação' },
    { id: 'planejamento', nome: 'Planejamento', icone: '📅', grupo: 'Validação' },
    { id: 'painel', nome: 'Painel', icone: '📊', grupo: 'Validação' },
    { id: 'clientes', nome: 'Clientes', icone: '🏢', grupo: 'Cadastros' },
    { id: 'equipamentos', nome: 'Equipamentos', icone: '⚙️', grupo: 'Cadastros' },
    { id: 'pecas', nome: 'Peças e amostras', icone: '🔩', grupo: 'Cadastros' },
    { id: 'calibracao', nome: 'Calibração', icone: '📏', grupo: 'Cadastros' },
    { id: 'permissoes', nome: 'Perfis e permissões', icone: '🔐', grupo: 'Administração' }
  ];

  /* fase filtra o catálogo por fase de aplicação do procedimento; tipoLti filtra
     demandas e planejamento pela classificação da LTI (inclui Cotação). */
  var filtros = {
    busca: '', clienteId: '', area: '', fase: '', tipoLti: '', status: '', equipamentoId: '',
    /* Filtros da janela de calibração. */
    buscaCal: '', localCal: '', marcaCal: '', situacaoCal: '', prazoCal: ''
  };
  var rotaAtual = 'catalogo';

  function contadores(estado, plano) {
    /* O contador da calibração mostra o que exige ação: vencido ou a vencer. */
    var cal = TC.calibracao.resumo(estado.instrumentos, util.hoje());
    var calibracaoPendente = cal.vencidos + cal.aVencer;
    return {
      catalogo: estado.testes.length,
      /* O contador mostra o que está em aberto no fluxo: ainda há algo a fazer enquanto
         a demanda não foi validada pelo cliente nem cancelada. */
      demandas: estado.demandas.filter(function (d) {
        return ['VALIDADA', 'CANCELADA'].indexOf(d.status) === -1;
      }).length,
      planejamento: plano.agendadas.length,
      cotacoes: estado.cotacoes.length,
      clientes: estado.clientes.length,
      equipamentos: estado.equipamentos.length,
      pecas: estado.pecas.length,
      calibracao: calibracaoPendente
    };
  }

  function desenharNavegacao(estado, plano) {
    var lateral = document.getElementById('lateral');
    var contas = contadores(estado, plano);
    var grupoAtual = '';
    var html = '';
    ROTAS.filter(function (r) { return TC.permissoes.podeVer(estado, r.id); }).forEach(function (r) {
      if (r.grupo !== grupoAtual) {
        grupoAtual = r.grupo;
        html += '<div class="nav-titulo">' + e(grupoAtual) + '</div>';
      }
      html += '<button class="nav-item' + (r.id === rotaAtual ? ' ativo' : '') + '" data-rota="' + e(r.id) + '">' +
        '<span aria-hidden="true">' + r.icone + '</span>' + e(r.nome) +
        (contas[r.id] !== undefined ? '<span class="contador">' + contas[r.id] + '</span>' : '') +
        '</button>';
    });
    var perfil = util.porId(TC.data.PERFIS, TC.permissoes.perfilAtual(estado));
    html += '<div class="perfil"><label for="seletor-perfil">Estou usando como</label>' +
      '<select id="seletor-perfil">' + ui.opcoes(TC.data.PERFIS, TC.permissoes.perfilAtual(estado)) + '</select>' +
      '<div class="descricao">' + e(perfil ? perfil.descricao : '') + '</div></div>';

    /* Na cópia publicada não há backup a exportar nem padrão a restaurar: o dado vive
       na máquina de quem mantém o centro de testes. Fica só a data do instantâneo, para
       ninguém tomar decisão em cima de um planejamento vencido sem perceber. */
    if (TC.permissoes.publicada()) {
      html += '<div style="margin-top:auto;padding:14px 10px 0" class="sub">' +
        '<strong>Cópia da equipe — somente leitura.</strong><br>' +
        'Dados de ' + e(util.formatarData(TC.PUBLICACAO.atualizadoEm, true)) + '. ' +
        'Para alterar catálogo, demandas ou cotações, fale com o centro de testes.</div>';
    } else {
      html += '<div class="nav-titulo">Dados</div>' +
        '<button class="nav-item" id="exportar"><span aria-hidden="true">⬇️</span>Exportar backup</button>' +
        '<button class="nav-item" id="importar"><span aria-hidden="true">⬆️</span>Importar backup</button>' +
        '<button class="nav-item" id="restaurar"><span aria-hidden="true">♻️</span>Restaurar padrão</button>' +
        '<div style="margin-top:auto;padding:14px 10px 0" class="sub">Dados gravados neste navegador. Exporte um backup antes de trocar de máquina.</div>';
    }

    lateral.querySelector('#menu').innerHTML = html;

    lateral.querySelectorAll('[data-rota]').forEach(function (botao) {
      botao.onclick = function () { ir(botao.dataset.rota); };
    });
    var seletor = lateral.querySelector('#seletor-perfil');
    seletor.onchange = function () {
      TC.store.definirPerfil(seletor.value);
      /* Trocar de perfil pode tirar a janela atual de vista. */
      if (!TC.permissoes.podeVer(TC.store.get(), rotaAtual)) ir(primeiraRotaVisivel());
    };
    if (TC.permissoes.publicada()) return;
    lateral.querySelector('#exportar').onclick = exportarBackup;
    lateral.querySelector('#importar').onclick = importarBackup;
    lateral.querySelector('#restaurar').onclick = function () {
      ui.confirmarAcao('Isto apaga todas as demandas e volta ao catálogo de exemplo. Continuar?', function () {
        TC.store.restaurarPadrao();
        ui.notificar('Dados restaurados.');
      });
    };
  }

  function primeiraRotaVisivel() {
    var estado = TC.store.get();
    for (var i = 0; i < ROTAS.length; i++) {
      if (TC.permissoes.podeVer(estado, ROTAS[i].id)) return ROTAS[i].id;
    }
    return 'catalogo';
  }

  function exportarBackup() {
    var url = URL.createObjectURL(new Blob([TC.store.exportar()], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'testing-center-' + util.hoje() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    ui.notificar('Backup exportado.');
  }

  function importarBackup() {
    var campo = document.createElement('input');
    campo.type = 'file';
    campo.accept = 'application/json';
    campo.onchange = function () {
      var arquivo = campo.files[0];
      if (!arquivo) return;
      var leitor = new FileReader();
      leitor.onload = function () {
        try {
          TC.store.importar(String(leitor.result));
          ui.notificar('Backup importado.');
        } catch (erro) {
          ui.notificar('Arquivo inválido: ' + erro.message);
        }
      };
      leitor.readAsText(arquivo);
    };
    campo.click();
  }

  function ir(rota) {
    if (!util.porId(ROTAS, rota)) rota = 'catalogo';
    if (!TC.permissoes.podeVer(TC.store.get(), rota)) rota = primeiraRotaVisivel();
    rotaAtual = rota;
    if (global.location.hash !== '#' + rota) global.location.hash = rota;
    global.scrollTo(0, 0);
    desenhar();
  }

  function desenhar() {
    var estado = TC.store.get();
    var hoje = util.hoje();
    var plano = TC.scheduler.planejar(estado, hoje);

    /* Uma mudança de permissão pode tornar a janela aberta invisível. */
    if (!TC.permissoes.podeVer(estado, rotaAtual)) rotaAtual = primeiraRotaVisivel();

    var ctx = {
      estado: estado,
      plano: plano,
      hoje: hoje,
      filtros: filtros,
      ir: ir,
      atualizar: desenhar,
      podeEditar: TC.permissoes.podeEditar(estado, rotaAtual)
    };

    desenharNavegacao(estado, plano);
    TC.views[rotaAtual].render(document.getElementById('conteudo'), ctx);

    /* Aviso discreto de somente leitura, para ninguém procurar um botão que não existe. */
    if (!ctx.podeEditar && rotaAtual !== 'painel') {
      var cabecalho = document.querySelector('#conteudo .cabecalho');
      if (cabecalho) {
        var acoes = cabecalho.querySelector('.acoes');
        if (!acoes) {
          acoes = document.createElement('div');
          acoes.className = 'acoes';
          cabecalho.appendChild(acoes);
        }
        acoes.appendChild(ui.el('<span class="somente-leitura">👁️ Somente leitura para ' +
          e(TC.permissoes.nomeDoPerfil(TC.permissoes.perfilAtual(estado))) + '</span>'));
      }
    }
  }

  function iniciar() {
    TC.store.init();
    TC.store.aoMudar(desenhar);
    var inicial = (global.location.hash || '').replace('#', '');
    rotaAtual = util.porId(ROTAS, inicial) ? inicial : 'catalogo';
    if (!TC.permissoes.podeVer(TC.store.get(), rotaAtual)) rotaAtual = primeiraRotaVisivel();
    global.addEventListener('hashchange', function () {
      var alvo = (global.location.hash || '').replace('#', '');
      if (alvo && alvo !== rotaAtual) ir(alvo);
    });
    desenhar();
  }

  TC.app = { iniciar: iniciar, ir: ir, ROTAS: ROTAS };

  /* Em página embutida o documento já pode estar pronto quando este script roda. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>
</body>
